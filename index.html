<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cohort Capital — Charge Intelligence</title>

<!-- ============================================================= -->
<!-- FONT: New Atten Round is the Cohort brand typeface. Paste your -->
<!-- standard base64 @font-face block below to embed it. DM Sans is -->
<!-- the documented fallback and is loaded here so the tool renders  -->
<!-- correctly out of the box.                                       -->
<!-- ============================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<!--
@font-face {
  font-family: 'New Atten Round';
  src: url(data:font/woff2;base64,PASTE_YOUR_BASE64_FONT_HERE) format('woff2');
  font-weight: 400 700;
  font-display: swap;
}
-->

<style>
:root{
  --navy:#212A58;
  --blue:#38499B;
  --deep-blue:#43519F;
  --mid-blue:#7483C1;
  --pale-blue:#E8EBF6;
  --pink:#FF63AE;
  --muted:#555570;
  --deep-navy:#2C297D;
  --body:#333348;
  --line:#e2e5f0;
  --line-soft:#e6e8f0;
  --bg:#f4f5f9;
  --font:'New Atten Round','DM Sans',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--body);font-family:var(--font);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* Header */
.site-header{background:var(--navy);position:sticky;top:0;z-index:200}
.site-header::after{content:'';display:block;height:3px;background:var(--pink)}
.header-inner{max-width:1180px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
/* PLACEHOLDER logo — swap for your base64-embedded <img> per brand guidelines */
.logo-ph{height:34px;display:flex;align-items:center;gap:9px}
.logo-ph .mark{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,var(--blue),var(--deep-navy));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;letter-spacing:.02em}
.logo-ph .wm{color:#fff;font-weight:700;font-size:16px;letter-spacing:.01em}
.logo-ph .wm small{display:block;font-weight:500;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid-blue);margin-top:-2px}
.badge{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);padding:5px 10px;border-radius:5px;white-space:nowrap}

/* Nav */
.nav{background:var(--deep-navy);position:sticky;top:49px;z-index:190}
.nav-inner{max-width:1180px;margin:0 auto;padding:0 28px;display:flex;gap:2px;overflow-x:auto}
.nav a{color:rgba(255,255,255,.72);font-weight:600;font-size:12px;letter-spacing:.02em;padding:11px 15px;white-space:nowrap;border-bottom:3px solid transparent}
.nav a:hover{color:#fff;text-decoration:none}
.nav a.active{color:#fff;border-bottom-color:var(--pink)}

/* Layout */
.wrap{max-width:1180px;margin:0 auto;padding:22px 28px 60px}
.notice{background:#fff6cf;border:1px solid #e7d27a;border-left:3px solid #d1a915;border-radius:0 4px 4px 0;padding:10px 14px;font-size:12px;color:#5a4a00;margin-bottom:18px;line-height:1.55}
.notice strong{color:#3d3200}

.card{background:#fff;border-radius:8px;border:1px solid var(--line);padding:22px 24px;box-shadow:0 1px 4px rgba(33,42,88,.06);margin-bottom:18px}
.card.pad-lg{padding:26px 28px}
.stitle{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:16px;padding-bottom:8px;border-bottom:1.5px solid var(--pale-blue);display:flex;align-items:center;gap:8px}
.stitle::before{content:'';display:inline-block;width:3px;height:14px;background:var(--pink);border-radius:2px;flex-shrink:0}
.stitle .count{margin-left:auto;color:var(--muted);font-weight:600;letter-spacing:0;text-transform:none;font-size:12px}
h1.page-h{font-size:24px;font-weight:700;color:var(--navy);margin-bottom:4px}
.page-sub{color:var(--muted);font-size:13px;margin-bottom:20px;max-width:760px}
h3{font-size:13.5px;font-weight:700;color:var(--navy)}

.callout{background:var(--pale-blue);border-left:3px solid var(--pink);border-radius:0 4px 4px 0;padding:12px 15px;font-size:12.5px;color:var(--navy);line-height:1.65;margin:4px 0 14px}

/* Filters */
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px}
.field{display:flex;flex-direction:column;gap:5px}
.field.span2{grid-column:span 2}
label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select{font-family:inherit;font-size:12.5px;color:var(--body);background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input:focus,select:focus{border-color:var(--mid-blue);outline:none}
select[multiple]{min-height:82px}
.hint{font-size:10.5px;color:var(--muted);font-style:italic}
.btnrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{font-size:12.5px;font-weight:700;letter-spacing:.02em;padding:9px 18px;border-radius:6px;border:1px solid transparent}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--deep-blue)}
.btn-ghost{background:#fff;color:var(--blue);border-color:var(--line)}
.btn-ghost:hover{background:var(--pale-blue)}
.btn-pink{background:var(--pink);color:#fff}
.btn-pink:hover{filter:brightness(.95)}
.btn-sm{font-size:11.5px;padding:6px 12px}

/* Tables */
table{width:100%;border-collapse:collapse}
thead th{background:var(--pale-blue);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);text-align:left;padding:9px 10px;border-bottom:2px solid var(--mid-blue);white-space:nowrap}
tbody td{padding:10px;border-bottom:1px solid var(--line-soft);font-size:12.5px;vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fafbff}
td.co{font-weight:700;color:var(--navy)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.co-sub{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:2px}

/* Chips / pills */
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.p-high{background:#ffe1ef;color:#b0246b;border:1px solid #ffb9d8}
.pill.p-med{background:#fff2d6;color:#8a6400;border:1px solid #f0d38f}
.pill.p-low{background:var(--pale-blue);color:var(--blue);border:1px solid #c8cde8}
.pill.p-watch{background:#eef0f4;color:var(--muted);border:1px solid #d8dce6}
.pill.st-out{background:#fff2d6;color:#8a6400;border:1px solid #f0d38f}
.pill.st-sat{background:#e3f3e8;color:#2f7a48;border:1px solid #bfe4cb}
.pill.st-active{background:#e3f3e8;color:#2f7a48;border:1px solid #bfe4cb}
.pill.st-dissolved{background:#f3e4e4;color:#a3423a;border:1px solid #e4c2be}
.tag{display:inline-block;background:var(--pale-blue);border:1px solid #c8cde8;border-radius:4px;font-size:11px;font-weight:600;color:var(--navy);padding:3px 9px;margin:2px 4px 2px 0}
.reasons{margin-top:3px}
.reasons span{display:inline-block;font-size:10.5px;color:var(--muted);background:#f6f7fb;border:1px solid var(--line);border-radius:4px;padding:2px 7px;margin:2px 4px 0 0}

/* Empty / meta */
.empty{padding:26px;text-align:center;color:var(--muted);font-size:12.5px;background:#fafbff;border:1px dashed var(--line);border-radius:8px}
.meta-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 26px}
.meta-grid .m{display:flex;flex-direction:column;gap:1px}
.meta-grid .m .k{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meta-grid .m .v{font-size:13px;color:var(--navy);font-weight:600}

/* Stat row */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:15px 16px;box-shadow:0 1px 4px rgba(33,42,88,.05)}
.stat .n{font-size:24px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* Timeline */
.tl{list-style:none;position:relative;margin-left:6px;padding-left:22px;border-left:2px solid var(--pale-blue)}
.tl li{position:relative;padding:0 0 16px 4px}
.tl li::before{content:'';position:absolute;left:-27px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--mid-blue);border:2px solid #fff}
.tl li.out::before{background:var(--pink)}
.tl .d{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.02em}
.tl .desc{font-size:12.5px;color:var(--body)}
.tl .desc strong{color:var(--navy)}

/* rule list */
ul.rules{list-style:none}
ul.rules li{position:relative;padding:7px 0 7px 18px;border-bottom:1px solid var(--pale-blue);font-size:12.5px}
ul.rules li:last-child{border-bottom:none}
ul.rules li::before{content:'';position:absolute;left:0;top:14px;width:5px;height:5px;border-radius:50%;background:var(--pink)}
ul.rules li strong{color:var(--navy)}

/* two-col */
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}

/* breadcrumb + back */
.crumb{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.crumb a{font-weight:600}

textarea{font-family:inherit;font-size:12.5px;width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-height:70px;resize:vertical;color:var(--body)}

.inline-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.small-link{font-size:11.5px;font-weight:600;cursor:pointer;color:var(--blue)}
.small-link:hover{text-decoration:underline}

.pattern-bar{height:8px;border-radius:4px;background:var(--pale-blue);overflow:hidden;margin-top:3px}
.pattern-bar i{display:block;height:100%;background:var(--mid-blue)}

.saved-item{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.saved-item h3{margin-bottom:3px}
.saved-item .meta{font-size:11.5px;color:var(--muted)}
.dyn{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.dyn.static{background:var(--pale-blue);color:var(--blue)}
.dyn.search{background:#ffe1ef;color:#b0246b}

.alert-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--pale-blue)}
.alert-item:last-child{border-bottom:none}
.alert-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.alert-item .a-body{flex:1}
.alert-item .a-body .a-t{font-size:12.5px;color:var(--navy);font-weight:600}
.alert-item .a-body .a-m{font-size:12px;color:var(--body)}
.alert-item .a-body .a-d{font-size:10.5px;color:var(--muted);margin-top:2px}

/* footer */
.site-footer{background:var(--navy);border-top:3px solid var(--pink);padding:18px 28px;margin-top:20px}
.footer-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.footer-inner .fl{color:rgba(255,255,255,.85);font-weight:600;font-size:12px}
.footer-inner .fr{color:var(--mid-blue);font-size:11px}

.prec{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.prec .ph{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.prec .pt{font-weight:700;color:var(--navy);font-size:12.5px}
.prec .src{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--pale-blue);color:var(--blue);white-space:nowrap}
.prec .src.ppd{background:#e3f3e8;color:#2f7a48}
.prec .src.ocod{background:#ffe1ef;color:#b0246b}
.prec .addr{font-size:11.5px;color:var(--muted);margin-top:3px}
.prec .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:7px 16px;margin-top:9px}
.prec .kv .k{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:block}
.prec .kv .v{font-size:12px;color:var(--navy);font-weight:600;display:block}
@media (max-width:600px){.prec .kv{grid-template-columns:1fr 1fr}}

/* step numbers (how-to walkthrough) */
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--pale-blue)}
.step:last-child{border-bottom:none}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step .b h3{font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:2px}
.step .b p{font-size:12.5px;color:var(--muted);line-height:1.6}
.step .b .go{font-size:11.5px;font-weight:700;color:var(--blue);margin-top:5px;display:inline-block}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feat .f{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#fff}
.feat .f h3{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:4px}
.feat .f p{font-size:12px;color:var(--muted);line-height:1.6}
.feat .f .q{font-size:11px;color:var(--blue);font-weight:600;margin-top:6px;display:block}
@media (max-width:600px){.feat{grid-template-columns:1fr}}

@media (max-width:900px){
  .filters{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .field.span2{grid-column:span 2}
}
@media (max-width:600px){
  .filters{grid-template-columns:1fr}
  .field.span2{grid-column:span 1}
  .stats{grid-template-columns:1fr 1fr}
  .header-inner{padding:12px 16px}
  .wrap{padding:16px}
  .logo-ph .wm small{display:none}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <!-- PLACEHOLDER: replace with your base64-embedded logo <img> at 34px height -->
      <div class="logo-ph" aria-label="Cohort Capital (logo placeholder)">
        <div class="mark">CC</div>
        <div class="wm">Cohort Capital<small>Charge Intelligence</small></div>
      </div>
    </div>
  </div>
</header>

<nav class="nav">
  <div class="nav-inner" id="nav"></div>
</nav>

<main class="wrap" id="view"></main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="fl">Cohort Capital — Charge Intelligence</div>
    <div class="fr">Internal origination platform</div>
  </div>
</footer>

<script>
/* =====================================================================
   COHORT CAPITAL — CHARGE INTELLIGENCE (live, no sample data)
   ---------------------------------------------------------------------
   All sample/synthetic data has been removed. The interface now uses:
   - Companies House via Netlify Functions:
       GET  /.netlify/functions/search?q=...&page=...
       GET  /.netlify/functions/company?number=...
       GET  /.netlify/functions/charge?company=...&charge=...
       POST /.netlify/functions/lead_list  { company_number: "..." }
   - Land Registry sections remain in the UI but are not yet connected.
   ===================================================================== */

const API = {
  search: '/.netlify/functions/search',
  company: '/.netlify/functions/company',
  charge: '/.netlify/functions/charge',
  leadList: '/.netlify/functions/lead_list'
};

const STATE = {
  // Search
  searchQuery: '',
  searchPage: 1,
  searchResult: null,          // { items, total_results, items_per_page, page_number, start_index }
  // Company
  selectedCompanyNumber: null,
  companyData: null,           // { company, officers, charges, stored_id }
  // Session lists
  staticList: [],              // company numbers added to lead list in this session
  monitored: [],               // company numbers monitored in this session
  notes: {},                   // no -> { note, owner }
  error: ''
};

const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = v => v ? new Date(v).toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'}) : '—';
const fmtMoney = n => n == null || n === '' ? '—' : '￡' + Number(n).toLocaleString('en-GB');

async function getJSON(url, options) {
  const r = await fetch(url, options);
  let d = {};
  try { d = await r.json(); } catch {}
  if (!r.ok) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}

/* -------------------- routing & nav -------------------- */
const ROUTES = [
  {path:'overview', label:'Overview'},
  {path:'search', label:'Search'},
  {path:'results', label:'Results'},
  {path:'company', label:'Company'},
  {path:'lenders', label:'Lenders'},
  {path:'leads', label:'Lead lists'},
  {path:'monitoring', label:'Monitoring'}
];

function setNav(active) {
  $('nav').innerHTML = ROUTES.map(r =>
    `<a href="#/${r.path}" class="${active===r.path?'active':''}">${r.label}</a>`
  ).join('');
}

function go(hash) { location.hash = '#/' + hash; }

function router() {
  const raw = (location.hash || '#/overview').replace(/^#\//, '');
  const [path, arg] = raw.split('/');
  setNav(path);
  window.scrollTo(0,0);

  if (path === 'overview') renderOverview();
  else if (path === 'search') renderSearch();
  else if (path === 'results') renderResults();
  else if (path === 'company') renderCompany(decodeURIComponent(arg || ''));
  else if (path === 'lenders') renderLenders();
  else if (path === 'leads') renderLeads();
  else if (path === 'monitoring') renderMonitoring();
  else renderOverview();
}

window.addEventListener('hashchange', router);

/* -------------------- shared UI bits -------------------- */
function priorityPill(band) {
  const map = {high:['p-high','High'], med:['p-med','Medium'], low:['p-low','Low'], watch:['p-watch','Watch']};
  const [cls, txt] = map[band] || ['p-watch','Watch'];
  return `<span class="pill ${cls}">${txt}</span>`;
}
function statusPill(s) {
  return s === 'active'
    ? '<span class="pill st-active">Active</span>'
    : '<span class="pill st-dissolved">Dissolved</span>';
}
function chargeStatusPill(s) {
  return s === 'outstanding'
    ? '<span class="pill st-out">Outstanding</span>'
    : '<span class="pill st-sat">Satisfied</span>';
}

/* -------------------- view: overview -------------------- */
function renderOverview() {
  $('view').innerHTML = `
    <h1 class="page-h">Charge Intelligence</h1>
    <p class="page-sub">Live Companies House search and company profiles, with Neon‑backed lead lists. Advanced filters are present but will be fully powered once the backend query layer is added.</p>
    <div class="card">
      <div class="stitle">Getting started</div>
      <ul class="rules">
        <li><strong>Search:</strong> use the Search tab to query Companies House by name or number.</li>
        <li><strong>Company profile:</strong> open a result to see officers, charges and save to a lead list.</li>
        <li><strong>Lead lists:</strong> companies saved in this session appear here; later this will be persisted server‑side.</li>
        <li><strong>Land Registry:</strong> property sections are visible on the company profile but are not yet connected to live data.</li>
      </ul>
      <div class="btnrow">
        <button class="btn btn-primary" onclick="go('search')">Start a company search</button>
        <button class="btn btn-ghost" onclick="go('leads')">Open lead lists</button>
      </div>
    </div>
  `;
}

/* -------------------- view: search (Option A: full UI, partial live) -------------------- */
function renderSearch() {
  $('view').innerHTML = `
    <h1 class="page-h">Search</h1>
    <p class="page-sub">Filter UK property‑related companies. In this version, only the name/number search is connected to live Companies House data; the remaining filters are present for the final implementation.</p>

    <div class="card pad-lg">
      <div class="stitle">Filters (backend‑powered in final version)</div>
      <div class="filters">
        <div class="field"><label>Company name or number (live)</label><input type="text" id="f_name" value="${esc(STATE.searchQuery)}" placeholder="e.g. property development"></div>
        <div class="field"><label>Company number</label><input type="text" id="f_number" placeholder="e.g. 10482233" disabled title="Will be enabled with backend"></div>
        <div class="field"><label>Director name</label><input type="text" id="f_director" placeholder="e.g. Aldertone" disabled title="Will be enabled with backend"></div>

        <div class="field"><label>Location / postcode / authority</label><input type="text" id="f_location" placeholder="e.g. London, SW11, Manchester" disabled title="Will be enabled with backend"></div>
        <div class="field"><label>SIC code</label><select id="f_sic" disabled title="Will be enabled with backend"><option>Any SIC code</option></select></div>
        <div class="field"><label>Company status</label>
          <select id="f_status" disabled title="Will be enabled with backend">
            <option value="active">Active only</option>
            <option value="dissolved">Dissolved only</option>
            <option value="all">Any status</option>
          </select></div>

        <div class="field"><label>Lender — include (borrowed from all selected)</label><select id="f_lenderInc" multiple disabled title="Will be enabled with backend"></select><span class="hint">Ctrl / Cmd click for multiple</span></div>
        <div class="field"><label>Lender — exclude (never borrowed from any selected)</label><select id="f_lenderExc" multiple disabled title="Will be enabled with backend"></select><span class="hint">e.g. exclude Cohort Capital to find non‑borrowers</span></div>
        <div class="field"><label>Cohort relationship</label>
          <select id="f_cohortRel" disabled title="Will be enabled with backend">
            <option value="any">Any</option>
            <option value="has">Existing or historic Cohort borrower</option>
            <option value="never">Never borrowed from Cohort</option>
          </select></div>

        <div class="field"><label>Charge status</label>
          <select id="f_chargeStatus" disabled title="Will be enabled with backend">
            <option value="any">Any</option>
            <option value="outstanding">Has outstanding charge</option>
            <option value="satisfied">Has satisfied charge</option>
          </select></div>
        <div class="field"><label>Charge‑age band</label>
          <select id="f_band" disabled title="Will be enabled with backend">
            <option value="any">Any age</option>
            <option value="recent">Recent (0–180 days)</option>
            <option value="monitoring">Monitoring (180–270 days)</option>
            <option value="window">Refinance window (270–450 days)</option>
            <option value="older">Older (450+ days)</option>
          </select></div>
        <div class="field"><label>Refinance signal</label>
          <select id="f_signal" disabled title="Will be enabled with backend">
            <option value="any">Any signal</option>
            <option>Recent charge</option>
            <option>Monitoring charge</option>
            <option>Potential refinance window</option>
            <option>Historical pattern</option>
            <option>High‑priority signal</option>
          </select></div>

        <div class="field"><label>Charge registered from</label><input type="date" id="f_regFrom" disabled title="Will be enabled with backend"></div>
        <div class="field"><label>Charge registered to</label><input type="date" id="f_regTo" disabled title="Will be enabled with backend"></div>
        <div class="field"><label>Min. charge count / min. distinct lenders</label>
          <div style="display:flex;gap:10px">
            <input type="number" id="f_minCharges" min="0" placeholder="Charges" disabled title="Will be enabled with backend">
            <input type="number" id="f_minLenders" min="0" placeholder="Lenders" disabled title="Will be enabled with backend">
          </div></div>
      </div>

      <div class="btnrow">
        <button class="btn btn-primary" onclick="runLiveSearch(1)">Search Companies House</button>
        <button class="btn btn-ghost" onclick="resetSearch()">Reset</button>
        <button class="btn btn-ghost" disabled title="Will be enabled with backend">Save this search</button>
      </div>
      <div id="searchStatus" class="status"></div>
    </div>

    <div id="resultsCard"></div>
  `;
}

async function runLiveSearch(page = 1) {
  const q = ($('f_name')?.value || '').trim();
  if (!q) {
    $('searchStatus').textContent = 'Enter a company name or number.';
    return;
  }
  STATE.searchQuery = q;
  STATE.searchPage = page;
  $('searchStatus').textContent = 'Searching Companies House…';
  $('resultsCard').innerHTML = '';

  try {
    STATE.searchResult = await getJSON(`${API.search}?q=${encodeURIComponent(q)}&page=${page}`);
    $('searchStatus').textContent = `${STATE.searchResult.total_results || 0} results found.`;
    renderSearchResults();
  } catch (e) {
    $('searchStatus').innerHTML = `<div class="error">${esc(e.message)}</div>`;
  }
}

function renderSearchResults() {
  const box = $('resultsCard');
  const items = (STATE.searchResult?.items) || [];
  if (!items.length) {
    box.innerHTML = STATE.searchQuery
      ? '<div class="card"><div class="empty">No results found.</div></div>'
      : '';
    return;
  }

  const rows = items.map(x => `
    <tr>
      <td class="co">
        <button class="company-btn" data-number="${esc(x.company_number)}">${esc(x.title || x.company_name)}</button>
        <span class="co-sub">${esc(x.company_status || '')}</span>
      </td>
      <td>${esc(x.company_number)}</td>
      <td>${esc([x.address?.address_line_1, x.address?.locality, x.address?.postal_code].filter(Boolean).join(', ') || '—')}</td>
    </tr>
  `).join('');

  const totalPages = Math.max(1, Math.ceil((STATE.searchResult.total_results || 0) / (STATE.searchResult.items_per_page || 20)));

  box.innerHTML = `
    <div class="card">
      <div class="stitle">Search results</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Company</th><th>Number</th><th>Address</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="pagination">
        <button class="btn btn-ghost" id="prev" ${STATE.searchPage <= 1 ? 'disabled' : ''}>Previous</button>
        <span>Page ${STATE.searchPage} of ${totalPages}</span>
        <button class="btn btn-ghost" id="next" ${STATE.searchPage >= totalPages ? 'disabled' : ''}>Next</button>
      </div>
    </div>
  `;

  box.querySelectorAll('.company-btn').forEach(b => {
    b.onclick = () => {
      STATE.selectedCompanyNumber = b.dataset.number;
      go(`company/${encodeURIComponent(b.dataset.number)}`);
    };
  });

  $('prev').onclick = () => runLiveSearch(STATE.searchPage - 1);
  $('next').onclick = () => runLiveSearch(STATE.searchPage + 1);
}

function resetSearch() {
  STATE.searchQuery = '';
  STATE.searchPage = 1;
  STATE.searchResult = null;
  $('f_name').value = '';
  $('searchStatus').textContent = '';
  $('resultsCard').innerHTML = '';
}

/* -------------------- view: results (placeholder, powered later) -------------------- */
function renderResults() {
  $('view').innerHTML = `
    <div class="crumb"><a href="#/search">Search</a> › Results</div>
    <h1 class="page-h">Results</h1>
    <p class="page-sub">In the final version this page will show ranked companies from your enriched dataset. For now, use the Search tab to query Companies House directly.</p>
    <div class="card"><div class="empty">Results view is a placeholder until the backend query layer is added.</div></div>
  `;
}

/* -------------------- view: company profile (live) -------------------- */
async function loadCompany(number) {
  STATE.selectedCompanyNumber = number;
  STATE.companyData = null;
  renderCompany(number, true);
  try {
    STATE.companyData = await getJSON(`${API.company}?number=${encodeURIComponent(number)}`);
    renderCompany(number, false);
  } catch (e) {
    $('companyOutput').innerHTML = `<div class="error">${esc(e.message)}</div>`;
  }
}

function renderCompany(number, loading = false) {
  if (loading || !STATE.companyData) {
    $('view').innerHTML = `
      <div class="btnrow" style="margin-top:0"><button class="btn btn-ghost" onclick="go('search')">← Back to search</button></div>
      <div class="card"><div class="status">Loading company profile…</div><div id="companyOutput"></div></div>
      <div class="card"><div class="stitle">Known properties</div><div class="empty">Land Registry data is not yet connected.</div></div>
    `;
    return;
  }

  const d = STATE.companyData;
  const c = d.company || {};
  const charges = d.charges || [];
  const officers = d.officers || [];
  const inList = STATE.staticList.includes(c.company_number);

  const timeline = charges.map(ch => `
    <li class="${ch.status === 'outstanding' ? 'out' : ''}">
      <div class="d">${fmtDate(ch.created_on || ch.delivered_on)} · ${ch.status === 'outstanding' ? 'Outstanding' : 'Satisfied'}</div>
      <div class="desc"><strong>${esc(ch.lender || ch.secured_party || '—')}</strong> — ${esc(ch.particulars?.description || ch.description || '—')}</div>
    </li>
  `).join('');

  const officersRows = officers.length ? `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Role</th><th>Appointed</th><th>Resigned</th></tr></thead>
        <tbody>
          ${officers.map(o => `
            <tr>
              <td>${esc(o.name)}</td>
              <td>${esc(o.officer_role)}</td>
              <td>${esc(o.appointed_on)}</td>
              <td>${esc(o.resigned_on || '—')}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  ` : '<div class="empty">No officers returned.</div>';

  const chargesRows = charges.length ? `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Charge number</th><th>Status</th><th>Created</th><th>Delivered</th><th>Description</th><th></th></tr></thead>
        <tbody>
          ${charges.map(ch => `
            <tr>
              <td>${esc(ch.charge_number || '—')}</td>
              <td>${esc(ch.status || '—')}</td>
              <td>${esc(ch.created_on || '—')}</td>
              <td>${esc(ch.delivered_on || '—')}</td>
              <td>${esc(ch.particulars?.description || ch.description || '—')}</td>
              <td><button class="btn btn-ghost btn-sm" data-charge="${esc(ch.charge_number || ch.charge_code || '')}">Details</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    <div id="chargeDetails"></div>
  ` : '<div class="empty">No charges returned.</div>';

  $('view').innerHTML = `
    <div class="btnrow" style="margin-top:0"><button class="btn btn-ghost" onclick="go('search')">← Back to search</button></div>

    <div class="card pad-lg">
      <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start">
        <div>
          <h1 class="page-h" style="margin-bottom:6px">${esc(c.company_name)} ${priorityPill('med')}</h1>
          <div style="color:var(--muted);font-size:12.5px">
            ${esc(c.company_number)} · ${statusPill(c.company_status)} · ${esc(c.type || '—')}
          </div>
        </div>
        <div class="btnrow" style="margin:0">
          <button class="btn ${inList ? 'btn-ghost' : 'btn-pink'} btn-sm" id="leadBtn">
            ${inList ? '✓ In session lead list' : '+ Add to lead list'}
          </button>
        </div>
      </div>
      <div id="leadStatus" class="status"></div>
    </div>

    <div class="cols">
      <div>
        <div class="card">
          <div class="stitle">Charges timeline</div>
          <ul class="tl">${timeline || '<li class="empty">No charges returned.</li>'}</ul>
        </div>
      </div>
      <div>
        <div class="card">
          <div class="stitle">Overview</div>
          <div class="meta-grid">
            <div class="m"><span class="k">Company number</span><span class="v">${esc(c.company_number)}</span></div>
            <div class="m"><span class="k">Status</span><span class="v">${c.company_status === 'active' ? 'Active' : 'Dissolved'}</span></div>
            <div class="m"><span class="k">Type</span><span class="v">${esc(c.type || '—')}</span></div>
            <div class="m"><span class="k">Incorporated</span><span class="v">${fmtDate(c.date_of_creation)}</span></div>
            <div class="m"><span class="k">Registered office</span><span class="v">${esc(Object.values(c.registered_office_address || {}).join(', ') || '—')}</span></div>
            <div class="m"><span class="k">SIC codes</span><span class="v">${esc((c.sic_codes || []).join(', ') || '—')}</span></div>
          </div>
        </div>
        <div class="card">
          <div class="stitle">Officers</div>
          ${officersRows}
        </div>
      </div>
    </div>

    <div class="card">
      <div class="stitle">Charges</div>
      ${chargesRows}
    </div>

    <div class="card">
      <div class="stitle">Known properties</div>
      <div class="callout" style="margin-top:0">Land Registry data is not yet connected. This section will show registered titles and sale history once the Land Registry Function is added.</div>
    </div>
  `;

  $('leadBtn').onclick = () => saveLead(c.company_number);

  // Charge detail delegation
  $('view').addEventListener('click', e => {
    const btn = e.target.closest('[data-charge]');
    if (!btn) return;
    const chargeId = btn.dataset.charge;
    loadChargeDetail(c.company_number, chargeId);
  });
}

async function loadChargeDetail(companyNumber, chargeId) {
  const container = $('chargeDetails');
  if (!container) return;
  container.innerHTML = '<div class="status">Loading charge details…</div>';
  try {
    const data = await getJSON(`${API.charge}?company=${encodeURIComponent(companyNumber)}&charge=${encodeURIComponent(chargeId)}`);
    container.innerHTML = `
      <div class="card">
        <div class="stitle">Charge detail</div>
        <pre style="white-space:pre-wrap;overflow:auto">${esc(JSON.stringify(data, null, 2))}</pre>
      </div>
    `;
  } catch (e) {
    container.innerHTML = `<div class="error">${esc(e.message)}</div>`;
  }
}

async function saveLead(companyNumber) {
  const statusEl = $('leadStatus');
  statusEl.textContent = 'Saving company to Neon‑backed lead list…';
  try {
    const data = await getJSON(API.leadList, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company_number })
    });
    if (!STATE.staticList.includes(companyNumber)) STATE.staticList.push(companyNumber);
    statusEl.textContent = `Saved to lead list ${data.lead_list_id}.`;
    $('leadBtn').textContent = '✓ Saved to lead list';
  } catch (e) {
    statusEl.innerHTML = `<span class="error">${esc(e.message)}</span>`;
  }
}

/* -------------------- view: lenders (placeholder) -------------------- */
function renderLenders() {
  $('view').innerHTML = `
    <h1 class="page-h">Lenders</h1>
    <p class="page-sub">This view will show lender‑level analytics once the backend dataset is populated.</p>
    <div class="card"><div class="empty">Lenders view is a placeholder until the backend query layer is added.</div></div>
  `;
}

/* -------------------- view: lead lists (session only) -------------------- */
function renderLeads() {
  const listRows = STATE.staticList.map(no => `
    <tr onclick="go('company/${encodeURIComponent(no)}')" style="cursor:pointer">
      <td class="co">${esc(no)}</td>
      <td onclick="event.stopPropagation()"><button class="btn btn-ghost btn-sm" onclick="removeFromList('${no}')">Remove</button></td>
    </tr>
  `).join('');

  $('view').innerHTML = `
    <h1 class="page-h">Lead lists</h1>
    <p class="page-sub">Companies saved in this browser session. In the final version this will be persisted server‑side.</p>
    <div class="card">
      <div class="stitle">Static list <span class="count">${STATE.staticList.length} companies</span></div>
      ${STATE.staticList.length
        ? `<div class="table-wrap"><table><thead><tr><th>Company number</th><th></th></tr></thead><tbody>${listRows}</tbody></table></div>`
        : `<div class="empty">No companies saved yet. Open Search, select a result and use "Add to lead list" on the company profile.</div>`
      }
    </div>
  `;
}

function removeFromList(no) {
  STATE.staticList = STATE.staticList.filter(x => x !== no);
  renderLeads();
}

function renderMonitoring() {
  $('view').innerHTML = `
    <h1 class="page-h">Monitoring</h1>
    <p class="page-sub">This view will show alerts on new charges, competitor activity and status changes once the backend ingest is in place.</p>
    <div class="card"><div class="empty">Monitoring view is a placeholder until the backend query layer is added.</div></div>
  `;
}
