<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strudel — Property Finance Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--navy:#212A58;--blue:#38499B;--deep-blue:#43519F;--mid-blue:#7483C1;--pale-blue:#E8EBF6;--pink:#FF63AE;--muted:#555570;--deep-navy:#2C297D;--body:#333348;--line:#e2e5f0;--line-soft:#e6e8f0;--bg:#f4f5f9;--font:'DM Sans',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);color:var(--body);font-family:var(--font);font-size:13px;line-height:1.6}button{font:inherit;cursor:pointer}a{color:var(--blue);text-decoration:none}.site-header{background:var(--navy);position:sticky;top:0;z-index:2}.site-header:after{content:'';display:block;height:3px;background:var(--pink)}.header-inner{max-width:1180px;margin:auto;padding:12px 28px;display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;gap:10px;color:#fff;font-size:17px;font-weight:700}.mark{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,var(--blue),var(--deep-navy));display:grid;place-items:center;color:#fff;font-size:13px}.badge{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:#ffffff1a;border:1px solid #ffffff33;padding:5px 10px;border-radius:5px}.nav{background:var(--deep-navy)}.nav-inner{max-width:1180px;margin:auto;padding:0 28px;display:flex;overflow:auto}.nav button{background:transparent;color:#ffffffb8;border:0;font-size:12px;font-weight:600;padding:11px 15px;border-bottom:3px solid transparent;white-space:nowrap}.nav button.active,.nav button:hover{color:#fff;border-bottom-color:var(--pink)}.wrap{max-width:1180px;margin:auto;padding:22px 28px 60px}.notice{background:#fff6cf;border:1px solid #e7d27a;border-left:3px solid #d1a915;border-radius:0 4px 4px 0;padding:10px 14px;font-size:12px;color:#5a4a00;margin-bottom:18px}.card{background:#fff;border-radius:8px;border:1px solid var(--line);padding:22px 24px;box-shadow:0 1px 4px #212a5810;margin-bottom:18px}.title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:16px;padding-bottom:8px;border-bottom:1.5px solid var(--pale-blue);display:flex;gap:8px;align-items:center}.title:before{content:'';width:3px;height:14px;background:var(--pink);border-radius:2px}.title span{margin-left:auto;color:var(--muted);font-size:12px;letter-spacing:0;text-transform:none}.page-h{font-size:24px;color:var(--navy);margin-bottom:4px}.sub{color:var(--muted);margin-bottom:20px}.callout{background:var(--pale-blue);border-left:3px solid var(--pink);padding:12px 15px;color:var(--navy);margin-bottom:16px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px}.field{display:flex;flex-direction:column;gap:5px}.span2{grid-column:span 2}label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}input,select{font:inherit;font-size:12.5px;color:var(--body);background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}.btnrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.btn{font-size:12px;font-weight:700;padding:9px 18px;border-radius:6px;border:1px solid transparent}.primary{background:var(--blue);color:#fff}.primary:hover{background:var(--deep-blue)}.ghost{background:#fff;color:var(--blue);border-color:var(--line)}.pink{background:var(--pink);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:15px 16px}.stat .n{font-size:24px;font-weight:700;color:var(--navy)}.stat .l{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th{background:var(--pale-blue);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);text-align:left;padding:9px 10px;border-bottom:2px solid var(--mid-blue);white-space:nowrap}td{padding:10px;border-bottom:1px solid var(--line-soft);font-size:12.5px;vertical-align:top}tbody tr:hover{background:#fafbff}.company{font-weight:700;color:var(--navy)}.small{display:block;color:var(--muted);font-size:11px;font-weight:500}.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}.high{background:#ffe1ef;color:#b0246b;border:1px solid #ffb9d8}.medium{background:#fff2d6;color:#8a6400;border:1px solid #f0d38f}.low{background:var(--pale-blue);color:var(--blue);border:1px solid #c8cde8}.outstanding{background:#fff2d6;color:#8a6400;border:1px solid #f0d38f}.active{background:#e3f3e8;color:#2f7a48;border:1px solid #bfe4cb}.empty{padding:26px;text-align:center;color:var(--muted);background:#fafbff;border:1px dashed var(--line);border-radius:8px}.hidden{display:none}.profile-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.timeline{border-left:2px solid var(--pale-blue);padding-left:22px;list-style:none}.timeline li{padding:0 0 16px;position:relative}.timeline li:before{content:'';position:absolute;left:-28px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--pink);border:2px solid #fff}.timeline strong{color:var(--navy)}.footer{background:var(--navy);border-top:3px solid var(--pink);padding:18px 28px;color:#ffffffcc;font-size:12px;display:flex;justify-content:space-between}.error{color:#a3423a;background:#f3e4e4;padding:12px;border-radius:6px}@media(max-width:900px){.filters{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.profile-grid{grid-template-columns:1fr}}@media(max-width:600px){.filters{grid-template-columns:1fr}.span2{grid-column:span 1}.wrap{padding:16px}.footer{display:block}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner"><div class="logo"><div class="mark">S</div><div>Strudel<small style="display:block;color:var(--mid-blue);font-size:9px;letter-spacing:.16em;text-transform:uppercase">Property finance intelligence</small></div></div><span class="badge">Prototype · v1</span></div></header>
<nav class="nav"><div class="nav-inner"><button class="active" data-view="search">Search</button><button data-view="results">Results</button><button data-view="leads">Lead lists</button><button data-view="monitoring">Monitoring</button><button data-view="lenders">Lenders</button></div></nav>
<main class="wrap" id="app"></main>
<footer class="footer"><span>Strudel — Property-finance origination intelligence</span><span>Prototype build · Connects to Companies House and Neon</span></footer>
<script>
const app=document.getElementById('app'), nav=[...document.querySelectorAll('.nav button')];
const sample=[
 {no:'10482233',name:'Golden Square Developments Ltd',town:'London',postcode:'W1F 9LA',sic:'41100',charges:3,lenders:3,latest:'Meridian Bridging',date:'14 Jun 2025',status:'Outstanding',priority:'High'},
 {no:'11204518',name:'Nine Elms Estates Ltd',town:'London',postcode:'SW11 7BA',sic:'68100',charges:3,lenders:2,latest:'Aldgate Debt Partners',date:'03 Jul 2025',status:'Outstanding',priority:'High'},
 {no:'09873321',name:'Kestrelmoor Property Holdings Ltd',town:'London',postcode:'W1U 7AL',sic:'68209',charges:3,lenders:3,latest:'Cohort Capital',date:'16 Apr 2026',status:'Outstanding',priority:'Medium'},
 {no:'12551009',name:'Shoreditch Regeneration SPV Ltd',town:'London',postcode:'EC2A 3AA',sic:'41100',charges:2,lenders:2,latest:'Cornerstone Bridging',date:'17 Oct 2025',status:'Outstanding',priority:'High'},
 {no:'10990032',name:'Harborne Commercial Ltd',town:'Birmingham',postcode:'B3 3AG',sic:'68209',charges:2,lenders:2,latest:'Cohort Capital',date:'09 Jun 2025',status:'Outstanding',priority:'Medium'}
];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function pill(v){return `<span class="pill ${v.toLowerCase()}">${esc(v)}</span>`}
function searchView(){app.innerHTML=`<div class="notice"><strong>Strudel prototype.</strong> Search UK property-related companies by lender relationships, secured borrowing history, location and potential refinance signals.</div><h1 class="page-h">Search</h1><p class="sub">Find companies that have borrowed from competitors, used multiple lenders or may be approaching a refinancing event.</p><div class="card"><div class="title">Search and filters</div><div class="filters"><div class="field span2"><label>Company, director, lender or postcode</label><input id="q" placeholder="e.g. Golden Square, London, Meridian Bridging"></div><div class="field"><label>Company status</label><select id="status"><option value="">Any status</option><option>Active</option><option>Dissolved</option></select></div><div class="field"><label>SIC code</label><select id="sic"><option value="">Any SIC code</option><option value="41100">41100 — Development</option><option value="68100">68100 — Buying and selling real estate</option><option value="68209">68209 — Letting and operating real estate</option></select></div><div class="field"><label>Lender include</label><input id="include" placeholder="Competitor lender"></div><div class="field"><label>Lender exclude</label><input id="exclude" placeholder="e.g. Cohort Capital"></div><div class="field"><label>Charge status</label><select id="charge"><option value="">Any status</option><option>Outstanding</option><option>Satisfied</option></select></div><div class="field"><label>Minimum charges</label><input id="min" type="number" min="0" placeholder="e.g. 2"></div><div class="field"><label>Minimum distinct lenders</label><input id="minl" type="number" min="0" placeholder="e.g. 2"></div></div><div class="btnrow"><button class="btn primary" id="run">Search companies</button><button class="btn ghost" id="reset">Reset</button><button class="btn ghost" id="save">Save as lead list</button></div></div><div class="callout">Example search: companies that have borrowed from a selected competitor, have an outstanding charge and have used at least two lenders.</div>`;document.getElementById('run').onclick=runSearch;document.getElementById('reset').onclick=searchView;document.getElementById('save').onclick=()=>alert('Saved-search functionality will be connected to Neon in the next step.')}
function filtered(){const q=(document.getElementById('q')?.value||'').toLowerCase(), status=document.getElementById('status')?.value||'',sic=document.getElementById('sic')?.value||'',include=(document.getElementById('include')?.value||'').toLowerCase(),exclude=(document.getElementById('exclude')?.value||'').toLowerCase(),charge=document.getElementById('charge')?.value||'',min=+(document.getElementById('min')?.value||0),minl=+(document.getElementById('minl')?.value||0);return sample.filter(c=>(!q||[c.name,c.no,c.town,c.postcode,c.latest].join(' ').toLowerCase().includes(q))&&(!sic||c.sic===sic)&&(!status||status==='Active')&&(!include||c.latest.toLowerCase().includes(include))&&(!exclude||!c.latest.toLowerCase().includes(exclude))&&(!charge||c.status===charge)&&c.charges>=min&&c.lenders>=minl)}
function resultsView(rows=sample){app.innerHTML=`<div class="notice"><strong>Prototype with sample data.</strong> The next backend step will replace these records with Companies House data stored in Neon.</div><h1 class="page-h">Results</h1><p class="sub">Ranked by borrowing activity and origination relevance.</p><div class="stats"><div class="stat"><div class="n">${rows.length}</div><div class="l">Companies matched</div></div><div class="stat"><div class="n">${rows.filter(x=>x.priority==='High').length}</div><div class="l">High priority</div></div><div class="stat"><div class="n">${rows.filter(x=>x.status==='Outstanding').length}</div><div class="l">Outstanding charges</div></div><div class="stat"><div class="n">${rows.filter(x=>x.lenders>1).length}</div><div class="l">Multiple lenders</div></div></div><div class="card"><div class="title">Matched companies <span>${rows.length} results</span></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Company</th><th>Location</th><th>SIC</th><th>Charges</th><th>Lenders</th><th>Latest lender</th><th>Latest charge</th><th>Status</th><th>Priority</th></tr></thead><tbody>${rows.map(c=>`<tr onclick="profile('${c.no}')"><td class="company">${esc(c.name)}<span class="small">${c.no}</span></td><td>${esc(c.town)}<span class="small">${esc(c.postcode)}</span></td><td>${esc(c.sic)}</td><td>${c.charges}</td><td>${c.lenders}</td><td>${esc(c.latest)}</td><td>${esc(c.date)}</td><td>${pill(c.status)}</td><td>${pill(c.priority)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No companies match the selected filters.</div>'}</div>`}
function profile(no){const c=sample.find(x=>x.no===no)||sample[0];app.innerHTML=`<div class="card"><button class="btn ghost" onclick="resultsView()">← Back to results</button><div style="margin-top:18px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap"><div><h1 class="page-h">${esc(c.name)}</h1><p class="sub">${c.no} · ${pill('Active')} · Property-related company</p></div><button class="btn pink" onclick="alert('Lead-list saving will be connected to Neon next.')">Save to lead list</button></div></div><div class="profile-grid"><div><div class="card"><div class="title">Charge timeline <span>${c.charges} charges</span></div><ul class="timeline"><li><strong>${esc(c.latest)}</strong> — outstanding secured charge<br><span class="small">${esc(c.date)} · potential refinance monitoring signal</span></li><li><strong>Previous lender</strong> — satisfied charge<br><span class="small">Historical borrowing activity</span></li></ul></div><div class="card"><div class="title">Connected companies</div><div class="empty">Director and SPV relationships will appear here after Companies House ingestion.</div></div></div><div><div class="card"><div class="title">Company overview</div><table><tr><td>Company number</td><td>${c.no}</td></tr><tr><td>Status</td><td>${pill('Active')}</td></tr><tr><td>Registered location</td><td>${esc(c.town)}, ${esc(c.postcode)}</td></tr><tr><td>SIC code</td><td>${esc(c.sic)}</td></tr><tr><td>Distinct lenders</td><td>${c.lenders}</td></tr></table></div><div class="card"><div class="title">Officers and directors</div><div class="empty">Officer profiles will be populated from Companies House.</div></div><div class="card"><div class="title">Known properties</div><div class="empty">Property enrichment will be added after the company and charge workflow is live.</div></div></div></div>`}
function leadsView(){app.innerHTML=`<h1 class="page-h">Lead lists</h1><p class="sub">Save companies and searches for follow-up by the origination team.</p><div class="card"><div class="title">Default Strudel leads <span>0 companies</span></div><div class="empty">No leads saved yet. Run a search and save relevant companies to this list.</div></div>`}
function monitoringView(){app.innerHTML=`<h1 class="page-h">Monitoring</h1><p class="sub">Monitor new charges, competitor borrowing, satisfied charges and connected-company activity.</p><div class="card"><div class="title">Alert feed</div><div class="empty">Monitoring alerts will appear here after the database connection is enabled.</div></div>`}
function lendersView(){app.innerHTML=`<h1 class="page-h">Lenders</h1><p class="sub">Explore companies by lender relationship and identify competitor borrower populations.</p><div class="card"><div class="title">Lender directory</div><div class="empty">Lender normalisation will populate this view from charge data.</div></div>`}
function runSearch(){resultsView(filtered())}function openView(v){nav.forEach(x=>x.classList.toggle('active',x.dataset.view===v));({search:searchView,results:()=>resultsView(),leads:leadsView,monitoring:monitoringView,lenders:lendersView}[v]||searchView)()}nav.forEach(x=>x.onclick=()=>openView(x.dataset.view));openView('search');window.profile=profile;window.resultsView=resultsView;
</script>
</body>
</html>
