<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strudel — Property Finance Intelligence</title>
<style>
:root{--navy:#212A58;--blue:#38499B;--deep:#2C297D;--mid:#7483C1;--pale:#E8EBF6;--pink:#FF63AE;--muted:#555570;--body:#333348;--line:#e2e5f0;--bg:#f4f5f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--body);font:13px/1.6 Arial,sans-serif}.header{background:var(--navy);color:#fff;border-bottom:3px solid var(--pink);padding:14px 28px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:20px;font-weight:700}.logo small{display:block;color:var(--mid);font-size:9px;text-transform:uppercase;letter-spacing:.14em}.badge{font-size:10px;text-transform:uppercase;letter-spacing:.1em;background:#ffffff1a;padding:5px 9px;border-radius:5px}.nav{background:var(--deep);padding:0 28px}.nav button{background:none;border:0;color:#ffffffb8;padding:11px 15px;border-bottom:3px solid transparent;cursor:pointer}.nav button.active,.nav button:hover{color:#fff;border-bottom-color:var(--pink)}main{max-width:1180px;margin:auto;padding:24px 28px 60px}.notice,.callout{padding:11px 14px;border-left:3px solid var(--pink);background:var(--pale);margin-bottom:18px}.notice{background:#fff6cf;border-left-color:#d1a915;color:#5a4a00}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px 24px;margin-bottom:18px;box-shadow:0 1px 4px #212a5810}.title{color:var(--blue);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--pale);padding-bottom:8px;margin-bottom:16px}.title span{float:right;color:var(--muted);letter-spacing:0;text-transform:none}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px}.field{display:flex;flex-direction:column;gap:5px}.span2{grid-column:span 2}label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}input,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}.buttons{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.btn{border:1px solid transparent;border-radius:6px;padding:9px 17px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.pink{background:var(--pink);color:#fff}.ghost{background:#fff;border-color:var(--line);color:var(--blue)}h1{color:var(--navy);font-size:24px;margin:0 0 5px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px}.stat strong{display:block;color:var(--navy);font-size:24px}.stat span{font-size:10px;text-transform:uppercase;font-weight:700;color:var(--muted)}table{width:100%;border-collapse:collapse}th{background:var(--pale);color:var(--navy);font-size:10px;text-transform:uppercase;text-align:left;padding:9px}td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}tr.clickable{cursor:pointer}tr.clickable:hover{background:#fafbff}.company{color:var(--navy);font-weight:700}.small{display:block;color:var(--muted);font-size:11px;font-weight:400}.pill{display:inline-block;border-radius:20px;padding:3px 9px;font-size:10px;font-weight:700}.active{background:#e3f3e8;color:#2f7a48}.outstanding{background:#fff2d6;color:#8a6400}.satisfied{background:#e3f3e8;color:#2f7a48}.high{background:#ffe1ef;color:#b0246b}.medium{background:#fff2d6;color:#8a6400}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}.error{padding:12px;background:#f3e4e4;color:#a3423a;border-radius:6px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.detail{background:#fafbff;border:1px solid var(--line);border-radius:6px;padding:12px;margin:10px 0}.detail summary{cursor:pointer;font-weight:700;color:var(--navy)}.source{font-size:11px}.footer{background:var(--navy);border-top:3px solid var(--pink);padding:18px 28px;color:#ffffffcc;font-size:12px;display:flex;justify-content:space-between}@media(max-width:800px){.filters,.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.span2{grid-column:span 2}}@media(max-width:550px){.filters,.stats{grid-template-columns:1fr}.span2{grid-column:span 1}main{padding:18px 14px}.footer{display:block}}
</style></head>
<body><header class="header"><div class="logo">Strudel<small>Property finance intelligence</small></div><div class="badge">Live data prototype</div></header><nav class="nav"><button class="active" data-page="search">Search</button><button data-page="leads">Lead lists</button><button data-page="monitoring">Monitoring</button></nav><main id="app"></main><footer class="footer"><span>Strudel — Property-finance origination intelligence</span><span>Companies House + Neon prototype</span></footer>
<script>
const app=document.getElementById('app'),api='/.netlify/functions';let current=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function call(path,opts){const r=await fetch(api+path,opts);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function search(){app.innerHTML=`<div class="notice"><strong>Strudel live-data prototype.</strong> Search UK companies through Companies House and open charges for detailed source information.</div><h1>Search</h1><p class="muted">Find companies, officers and secured borrowing activity.</p><div class="card"><div class="title">Company search</div><div class="filters"><div class="field span2"><label>Company name or company number</label><input id="q" placeholder="e.g. property company or 10482233"></div><div class="field"><label>Charge focus</label><select id="focus"><option>Any charges</option><option>Outstanding charges</option></select></div></div><div class="buttons"><button class="btn primary" id="go">Search Companies House</button><button class="btn ghost" id="clear">Clear</button></div></div><div class="callout">The first live release uses Companies House company, officer and charge records. Property addresses and amounts are shown only where the source provides them.</div>`;document.getElementById('go').onclick=run;document.getElementById('clear').onclick=search;document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')run()}}
async function run(){const q=document.getElementById('q').value.trim();if(!q)return;app.innerHTML='<div class="card">Searching Companies House…</div>';try{const d=await call('/search?q='+encodeURIComponent(q));current=d.items||[];results(current)}catch(e){app.innerHTML=`<div class="error">${esc(e.message)}</div><div class="buttons"><button class="btn ghost" onclick="search()">Back</button></div>`}}
function results(items){app.innerHTML=`<div class="notice"><strong>Live Companies House results.</strong> Open a company to retrieve its officers, charges and store the company in Neon.</div><h1>Results</h1><p class="muted">${items.length} result${items.length===1?'':'s'} returned.</p><div class="stats"><div class="stat"><strong>${items.length}</strong><span>Companies matched</span></div><div class="stat"><strong>Live</strong><span>Source</span></div><div class="stat"><strong>CH</strong><span>Company data</span></div><div class="stat"><strong>Open</strong><span>Profile to inspect</span></div></div><div class="card"><div class="title">Companies House results</div>${items.length?`<div style="overflow:auto"><table><thead><tr><th>Company</th><th>Status</th><th>Address</th><th>SIC</th></tr></thead><tbody>${items.map(x=>`<tr class="clickable" onclick="profile('${esc(x.company_number)}')"><td class="company">${esc(x.title)}<span class="small">${esc(x.company_number)}</span></td><td><span class="pill active">${esc(x.company_status||'Unknown')}</span></td><td>${esc(x.address_snippet||'—')}</td><td>${esc((x.sic_codes||[]).join(', ')||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No companies found.</div>'}<div class="buttons"><button class="btn ghost" onclick="search()">New search</button></div></div>`}
function chargeRow(x,i){const status=x.satisfied_on?'Satisfied':'Outstanding';return `<details class="detail"><summary>Charge ${esc(x.charge_number||x.charge_code||String(i+1))} · ${esc(x.created_on||'No date')} · <span class="pill ${status.toLowerCase()}">${status}</span></summary><table><tr><td>Created</td><td>${esc(x.created_on||'Not stated')}</td></tr><tr><td>Delivered</td><td>${esc(x.delivered_on||'Not stated')}</td></tr><tr><td>Satisfied</td><td>${esc(x.satisfied_on||'Not satisfied')}</td></tr><tr><td>Lender / entitled party</td><td>${esc((x.persons_entitled||[]).map(p=>p.name).join(', ')||'Not stated')}</td></tr><tr><td>Charge particulars</td><td>${esc(x.particulars?.description||x.description||'Not stated')}</td></tr><tr><td>Secured details</td><td>${esc(x.secured_details?.description||'Not stated')}</td></tr><tr><td>Property/location text</td><td>${esc(x.particulars?.description||x.secured_details?.description||'No structured property location returned')}</td></tr></table></details>`}
async function profile(number){app.innerHTML='<div class="card">Loading company profile, officers and detailed charges…</div>';try{const d=await call('/company?number='+encodeURIComponent(number));const c=d.company,off=d.officers||[],charges=d.charges||[],address=c.registered_office_address||{};app.innerHTML=`<div class="card"><button class="btn ghost" onclick="results(current)">← Back</button><div style="margin-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h1>${esc(c.company_name)}</h1><p class="muted">${esc(c.company_number)} · ${esc(c.company_status||'')}</p></div><button class="btn pink" onclick="saveLead('${esc(c.company_number)}')">Save to lead list</button></div></div><div class="grid"><div><div class="card"><div class="title">Charges <span>${charges.length}</span></div>${charges.length?charges.map(chargeRow).join(''):'<div class="empty">No charges returned.</div>'}</div><div class="card"><div class="title">Location and map readiness</div><table><tr><td>Registered office</td><td>${esc(Object.values(address).join(', ')||'Not stated')}</td></tr><tr><td>Charge/property address</td><td>Shown from charge particulars where provided</td></tr><tr><td>Map status</td><td>Postcode mapping will be added after address extraction and geocoding</td></tr></table></div></div><div><div class="card"><div class="title">Overview</div><table><tr><td>Company number</td><td>${esc(c.company_number)}</td></tr><tr><td>Status</td><td>${esc(c.company_status||'—')}</td></tr><tr><td>Incorporated</td><td>${esc(c.date_of_creation||'—')}</td></tr><tr><td>SIC codes</td><td>${esc((c.sic_codes||[]).join(', ')||'—')}</td></tr></table></div><div class="card"><div class="title">Officers <span>${off.length}</span></div>${off.length?`<ul>${off.map(x=>`<li><strong>${esc(x.name)}</strong> — ${esc(x.officer_role||'')}</li>`).join('')}</ul>`:'<div class="empty">No officers returned.</div>'}</div><div class="card source"><div class="title">Source</div><a href="https://find-and-update.company-information.service.gov.uk/company/${encodeURIComponent(c.company_number)}" target="_blank" rel="noopener">Open Companies House record</a></div></div></div>`}catch(e){app.innerHTML=`<div class="error">${esc(e.message)}</div><div class="buttons"><button class="btn ghost" onclick="results(current)">Back</button></div>`}}
async function saveLead(number){try{const r=await call('/lead_list',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({company_number:number})});alert(r.ok?'Company saved to the default Strudel lead list.':'Could not save company.')}catch(e){alert(e.message)}}
function leads(){app.innerHTML='<h1>Lead lists</h1><p class="muted">Saved companies and searches for the origination team.</p><div class="card"><div class="title">Default Strudel leads</div><div class="empty">Lead-list records will appear here as companies are saved.</div></div>'}function monitoring(){app.innerHTML='<h1>Monitoring</h1><p class="muted">Monitor new charges, competitor borrowing and company changes.</p><div class="card"><div class="empty">Monitoring rules will be added after the first live company workflow is verified.</div></div>'}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');({search,leads,monitoring}[b.dataset.page])()});search();
</script></body></html>
