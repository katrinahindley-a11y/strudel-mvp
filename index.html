<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cohort Capital — Charge Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--navy:#212A58;--blue:#38499B;--deep-blue:#43519F;--mid-blue:#7483C1;--pale-blue:#E8EBF6;--pink:#FF63AE;--muted:#555570;--deep-navy:#2C297D;--body:#333348;--line:#e2e5f0;--line-soft:#e6e8f0;--bg:#f4f5f9;--font:'DM Sans',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);color:var(--body);font-family:var(--font);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button{font-family:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.site-header{background:var(--navy);position:sticky;top:0;z-index:200}.site-header::after{content:'';display:block;height:3px;background:var(--pink)}.header-inner{max-width:1180px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:14px;min-width:0}.logo-ph{height:34px;display:flex;align-items:center;gap:9px}.logo-ph .mark{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,var(--blue),var(--deep-navy));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;letter-spacing:.02em}.logo-ph .wm{color:#fff;font-weight:700;font-size:16px;letter-spacing:.01em}.logo-ph .wm small{display:block;font-weight:500;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid-blue);margin-top:-2px}
.nav{background:var(--deep-navy);position:sticky;top:49px;z-index:190}.nav-inner{max-width:1180px;margin:0 auto;padding:0 28px;display:flex;gap:2px;overflow-x:auto}.nav a{color:rgba(255,255,255,.72);font-weight:600;font-size:12px;letter-spacing:.02em;padding:11px 15px;white-space:nowrap;border-bottom:3px solid transparent}.nav a:hover{color:#fff;text-decoration:none}.nav a.active{color:#fff;border-bottom-color:var(--pink)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 28px 60px}.card{background:#fff;border-radius:8px;border:1px solid var(--line);padding:22px 24px;box-shadow:0 1px 4px rgba(33,42,88,.06);margin-bottom:18px}.card.pad-lg{padding:26px 28px}.stitle{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:16px;padding-bottom:8px;border-bottom:1.5px solid var(--pale-blue);display:flex;align-items:center;gap:8px}.stitle::before{content:'';display:inline-block;width:3px;height:14px;background:var(--pink);border-radius:2px;flex-shrink:0}.stitle .count{margin-left:auto;color:var(--muted);font-weight:600;letter-spacing:0;text-transform:none;font-size:12px}h1.page-h{font-size:24px;font-weight:700;color:var(--navy);margin-bottom:4px}.page-sub{color:var(--muted);font-size:13px;margin-bottom:20px;max-width:760px}
.callout{background:var(--pale-blue);border-left:3px solid var(--pink);border-radius:0 4px 4px 0;padding:12px 15px;font-size:12.5px;color:var(--navy);line-height:1.65;margin:4px 0 14px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px}.field{display:flex;flex-direction:column;gap:5px}label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}input[type=text],input[type=number],input[type=date],select{font-family:inherit;font-size:12.5px;color:var(--body);background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}input:focus,select:focus{border-color:var(--mid-blue);outline:none}input:disabled,select:disabled{opacity:.55;cursor:not-allowed}select[multiple]{min-height:82px}.hint{font-size:10.5px;color:var(--muted);font-style:italic}.btnrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.btn{font-size:12.5px;font-weight:700;letter-spacing:.02em;padding:9px 18px;border-radius:6px;border:1px solid transparent}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--deep-blue)}.btn-ghost{background:#fff;color:var(--blue);border-color:var(--line)}.btn-ghost:hover{background:var(--pale-blue)}.btn-pink{background:var(--pink);color:#fff}.btn-pink:hover{filter:brightness(.95)}.btn-sm{font-size:11.5px;padding:6px 12px}.btn:disabled{opacity:.5;cursor:not-allowed}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}thead th{background:var(--pale-blue);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);text-align:left;padding:9px 10px;border-bottom:2px solid var(--mid-blue);white-space:nowrap}tbody td{padding:10px;border-bottom:1px solid var(--line-soft);font-size:12.5px;vertical-align:top}tbody tr:hover{background:#fafbff}td.co{font-weight:700;color:var(--navy)}.co-sub{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:2px}.company-btn{border:0;background:transparent;color:var(--navy);font:inherit;font-weight:700;text-align:left;padding:0}.company-btn:hover{text-decoration:underline;color:var(--blue)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:20px;white-space:nowrap}.pill.p-med{background:#fff2d6;color:#8a6400;border:1px solid #f0d38f}.pill.st-active{background:#e3f3e8;color:#2f7a48;border:1px solid #bfe4cb}.pill.st-dissolved{background:#f3e4e4;color:#a3423a;border:1px solid #e4c2be}.empty{padding:26px;text-align:center;color:var(--muted);font-size:12.5px;background:#fafbff;border:1px dashed var(--line);border-radius:8px}.error{margin-top:12px;padding:10px 14px;background:#fdf0ef;border:1px solid #e4c2be;border-left:3px solid #a3423a;border-radius:0 4px 4px 0;color:#842d27}.status{font-size:12px;color:var(--muted);margin-top:12px}.pagination{display:flex;align-items:center;gap:10px;margin-top:16px}.meta-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 26px}.meta-grid .m{display:flex;flex-direction:column;gap:1px}.meta-grid .m .k{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.meta-grid .m .v{font-size:13px;color:var(--navy);font-weight:600}.tl{list-style:none;position:relative;margin-left:6px;padding-left:22px;border-left:2px solid var(--pale-blue)}.tl li{position:relative;padding:0 0 16px 4px}.tl li::before{content:'';position:absolute;left:-27px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--mid-blue);border:2px solid #fff}.tl li.out::before{background:var(--pink)}.tl .d{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.02em}.tl .desc{font-size:12.5px;color:var(--body)}.tl .desc strong{color:var(--navy)}ul.rules{list-style:none}ul.rules li{position:relative;padding:7px 0 7px 18px;border-bottom:1px solid var(--pale-blue);font-size:12.5px}ul.rules li:last-child{border-bottom:none}ul.rules li::before{content:'';position:absolute;left:0;top:14px;width:5px;height:5px;border-radius:50%;background:var(--pink)}.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}.crumb{font-size:11.5px;color:var(--muted);margin-bottom:12px}.site-footer{background:var(--navy);border-top:3px solid var(--pink);padding:18px 28px;margin-top:20px}.footer-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.footer-inner .fl{color:rgba(255,255,255,.85);font-weight:600;font-size:12px}.footer-inner .fr{color:var(--mid-blue);font-size:11px}
@media(max-width:900px){.filters{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:600px){.filters,.meta-grid{grid-template-columns:1fr}.header-inner,.wrap{padding-left:16px;padding-right:16px}.nav-inner{padding:0 16px}.logo-ph .wm small{display:none}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner"><div class="brand"><div class="logo-ph" aria-label="Cohort Capital"><div class="mark">CC</div><div class="wm">Cohort Capital<small>Charge Intelligence</small></div></div></div></div></header>
<nav class="nav"><div class="nav-inner" id="nav"></div></nav>
<main class="wrap" id="view"></main>
<footer class="site-footer"><div class="footer-inner"><div class="fl">Cohort Capital — Charge Intelligence</div><div class="fr">Internal origination platform</div></div></footer>
<script>
const API={
  search:'/.netlify/functions/search',
  officerSearch:'/.netlify/functions/officer_search',
  postcodeSearch:'/.netlify/functions/advanced_company_search',
  companyProfile:'/.netlify/functions/company_profile',
  companyImport:'/.netlify/functions/company',
  leadList:'/.netlify/functions/lead_list'
};
const STATE={
  searchMode:'company',
  searchQuery:'',
  searchPage:1,
  searchResult:null,
  selectedCompanyNumber:null,
  companyData:null,
  staticList:[]
};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=v=>v?new Date(v).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'—';
async function getJSON(url,options){const response=await fetch(url,options);let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error||`Request failed (${response.status})`);return data}
const ROUTES=[{path:'overview',label:'Overview'},{path:'search',label:'Search'},{path:'results',label:'Results'},{path:'leads',label:'Lead lists'},{path:'monitoring',label:'Monitoring'},{path:'lenders',label:'Lenders'}];
function setNav(active){$('nav').innerHTML=ROUTES.map(r=>`<a href="#/${r.path}" class="${active===r.path?'active':''}">${r.label}</a>`).join('')}
function go(path){location.hash='#/'+path}
function router(){const raw=(location.hash||'#/overview').replace(/^#\//,'');const [path,arg]=raw.split('/');setNav(path);window.scrollTo(0,0);if(path==='overview')renderOverview();else if(path==='search')renderSearch();else if(path==='results')renderResults();else if(path==='company'){const companyNumber=decodeURIComponent(arg||'');if(!companyNumber){renderResults();return}if(STATE.selectedCompanyNumber!==companyNumber||!STATE.companyData)loadCompanyProfile(companyNumber);else renderCompany(companyNumber,false)}else if(path==='lenders')renderLenders();else if(path==='leads')renderLeads();else if(path==='monitoring')renderMonitoring();else renderOverview()}
window.addEventListener('hashchange',router);
function priorityPill(){return '<span class="pill p-med">Live data</span>'}
function statusPill(status){return status==='active'?'<span class="pill st-active">Active</span>':'<span class="pill st-dissolved">'+esc(status||'Unknown')+'</span>'}
function renderOverview(){$('view').innerHTML=`<h1 class="page-h">Charge Intelligence</h1><p class="page-sub">Live Companies House search and read-only company profiles. Companies are only imported into Neon when you choose to add them to a lead list.</p><div class="card"><div class="stitle">Getting started</div><ul class="rules"><li><strong>Search:</strong> query Companies House by company name/number, director name, or registered-office postcode.</li><li><strong>Company profile:</strong> open a result to see live public company, officer and charge data.</li><li><strong>Charge detail:</strong> use Details to see the charge record returned by Companies House.</li><li><strong>Lead list:</strong> choose Add to lead list to import the company and charges into Neon, then save the membership.</li></ul><div class="btnrow"><button class="btn btn-primary" onclick="go('search')">Start a company search</button><button class="btn btn-ghost" onclick="go('leads')">Open lead lists</button></div></div>`}
function renderSearch(){$('view').innerHTML=`<h1 class="page-h">Search</h1><p class="page-sub">Search live Companies House records by company name/number, director name, or registered-office postcode.</p><div class="card pad-lg"><div class="stitle">Filters</div><div class="filters"><div class="field"><label>Company name or number</label><input type="text" id="f_company" placeholder="e.g. property development or 12345678"></div><div class="field"><label>Director name</label><input type="text" id="f_director" placeholder="e.g. John Smith"></div><div class="field"><label>Registered-office postcode</label><input type="text" id="f_postcode" placeholder="e.g. SW1A 1AA"></div><div class="field"><label>SIC code</label><select disabled><option>Any SIC code</option></select></div><div class="field"><label>Company status</label><select disabled><option>Active only</option><option>Any status</option></select></div><div class="field"><label>Lender — include</label><select multiple disabled></select><span class="hint">Enabled when charge data is queryable in Neon</span></div><div class="field"><label>Lender — exclude</label><select multiple disabled></select><span class="hint">Enabled when charge data is queryable in Neon</span></div><div class="field"><label>Cohort relationship</label><select disabled><option>Any</option></select></div><div class="field"><label>Charge status</label><select disabled><option>Any</option></select></div><div class="field"><label>Charge-age band</label><select disabled><option>Any age</option></select></div><div class="field"><label>Refinance signal</label><select disabled><option>Any signal</option></select></div></div><div class="btnrow"><button class="btn btn-primary" id="searchButton">Search</button><button class="btn btn-ghost" id="resetButton">Reset</button></div><div id="searchStatus" class="status"></div></div><div id="resultsCard"></div>`;$('searchButton').onclick=()=>runSearch(1);$('resetButton').onclick=resetSearch;$('f_company').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch(1)});$('f_director').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch(1)});$('f_postcode').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch(1)})}
async function runSearch(page=1){const companyQuery=($('f_company')?.value||'').trim();const directorQuery=($('f_director')?.value||'').trim();const postcodeQuery=($('f_postcode')?.value||'').trim().toUpperCase().replace(/\s+/g,'');const nonEmpty=[companyQuery,directorQuery,postcodeQuery].filter(Boolean);if(nonEmpty.length===0){$('searchStatus').textContent='Enter a company name/number, director name, or postcode.';return}if(nonEmpty.length>1){$('searchStatus').textContent='Please use only one search field at a time.';return}STATE.searchPage=page;$('searchStatus').textContent='Searching Companies House…';$('resultsCard').innerHTML='';try{if(companyQuery){STATE.searchMode='company';STATE.searchQuery=companyQuery;STATE.searchResult=await getJSON(`${API.search}?q=${encodeURIComponent(companyQuery)}&page=${page}`);}else if(directorQuery){STATE.searchMode='officer';STATE.searchQuery=directorQuery;STATE.searchResult=await getJSON(`${API.officerSearch}?q=${encodeURIComponent(directorQuery)}&page=${page}`);}else if(postcodeQuery){STATE.searchMode='postcode';STATE.searchQuery=postcodeQuery;STATE.searchResult=await getJSON(`${API.postcodeSearch}?postcode=${encodeURIComponent(postcodeQuery)}&page=${page}`);}$('searchStatus').textContent=`${STATE.searchResult.total_results||0} results found.`;renderSearchResults()}catch(error){$('searchStatus').innerHTML=`<div class="error">${esc(error.message)}</div>`}}
function renderSearchResults(){const box=$('resultsCard');let items=[];if(STATE.searchMode==='company'||STATE.searchMode==='postcode'){items=STATE.searchResult?.items||[];}else if(STATE.searchMode==='officer'){items=STATE.searchResult?.items||[];}if(!items.length){box.innerHTML='<div class="card"><div class="empty">No results found.</div></div>';return}let rows='';if(STATE.searchMode==='company'||STATE.searchMode==='postcode'){rows=items.map(item=>`<tr><td class="co"><button class="company-btn" data-number="${esc(item.company_number)}">${esc(item.title||item.company_name||'Unnamed company')}</button><span class="co-sub">${esc(item.company_status||'')}</span></td><td>${esc(item.company_number)}</td><td>${esc([item.address?.address_line_1,item.address?.locality,item.address?.postal_code].filter(Boolean).join(', ')||'—')}</td></tr>`).join('');}else if(STATE.searchMode==='officer'){rows=items.map(item=>{const address=[item.address?.address_line_1,item.address?.locality,item.address?.postal_code].filter(Boolean).join(', ');const appointments=item.appointments||{};const active=appointments?.active??0;const total=appointments?.total??0;return `<tr><td class="co"><div>${esc(item.name||'Unnamed officer')}</div><span class="co-sub">${esc(item.officer_role||'Officer')}</span></td><td>${esc(item.date_of_birth?.month&&item.date_of_birth?.year?`${item.date_of_birth.month}/${item.date_of_birth.year}`:'—')}</td><td>${esc(address||'—')}<div style="font-size:11px;color:var(--muted);margin-top:2px">${active} active / ${total} total appointments</div></td></tr>`;}).join('');}const perPage=STATE.searchResult.items_per_page||20;const totalPages=Math.max(1,Math.ceil((STATE.searchResult.total_results||0)/perPage));box.innerHTML=`<div class="card"><div class="stitle">Search results</div><div class="table-wrap"><table><thead><tr><th>${STATE.searchMode==='officer'?'Officer':'Company'}</th>${STATE.searchMode==='officer'?'<th>Date of birth</th>':''}<th>${STATE.searchMode==='officer'?'Address / appointments':'Number / address'}</th></tr></thead><tbody>${rows}</tbody></table></div><div class="pagination"><button class="btn btn-ghost" id="previousPage" ${STATE.searchPage<=1?'disabled':''}>Previous</button><span>Page ${STATE.searchPage} of ${totalPages}</span><button class="btn btn-ghost" id="nextPage" ${STATE.searchPage>=totalPages?'disabled':''}>Next</button></div></div>`;if(STATE.searchMode==='company'||STATE.searchMode==='postcode'){box.querySelectorAll('.company-btn').forEach(button=>button.onclick=()=>go(`company/${encodeURIComponent(button.dataset.number)}`));}$('previousPage').onclick=()=>runSearch(STATE.searchPage-1);$('nextPage').onclick=()=>runSearch(STATE.searchPage+1)}
function resetSearch(){STATE.searchMode='company';STATE.searchQuery='';STATE.searchPage=1;STATE.searchResult=null;$('f_company').value='';$('f_director').value='';$('f_postcode').value='';$('searchStatus').textContent='';$('resultsCard').innerHTML=''}
function renderResults(){$('view').innerHTML=`<div class="crumb"><a href="#/search">Search</a> › Results</div><h1 class="page-h">Results</h1><p class="page-sub">The ranked Results view will be enabled when the backend query layer can search imported Neon records by lender, charge age, SIC, location and relationship status.</p><div class="card"><div class="empty">Use the Search tab for live Companies House search.</div></div>`}
async function loadCompanyProfile(number){STATE.selectedCompanyNumber=number;STATE.companyData=null;renderCompany(number,true);try{STATE.companyData=await getJSON(`${API.companyProfile}?number=${encodeURIComponent(number)}`);renderCompany(number,false)}catch(error){const output=$('companyOutput');if(output)output.innerHTML=`<div class="error">${esc(error.message)}</div>`}}
function renderCompany(number,loading=false){if(loading||!STATE.companyData){$('view').innerHTML=`<div class="btnrow" style="margin-top:0"><button class="btn btn-ghost" onclick="go('search')">← Back to search</button></div><div class="card"><div class="status">Loading company profile…</div><div id="companyOutput"></div></div><div class="card"><div class="stitle">Known properties</div><div class="empty">Land Registry data is not yet connected.</div></div>`;return}const data=STATE.companyData;const company=data.company||{};const charges=data.charges||[];const officers=data.officers||[];const inList=STATE.staticList.includes(company.company_number);const timeline=charges.map(charge=>`<li class="${charge.status==='outstanding'?'out':''}"><div class="d">${fmtDate(charge.created_on||charge.delivered_on)} · ${esc(charge.status||'Unknown')}</div><div class="desc"><strong>${esc(charge.lender||charge.secured_party||'Secured party not specified')}</strong> — ${esc(charge.particulars?.description||charge.description||'—')}</div></li>`).join('');const officerRows=officers.length?`<div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Appointed</th><th>Resigned</th></tr></thead><tbody>${officers.map(officer=>`<tr><td>${esc(officer.name)}</td><td>${esc(officer.officer_role)}</td><td>${esc(officer.appointed_on)}</td><td>${esc(officer.resigned_on||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No officers returned.</div>';const chargeRows=charges.length?`<div class="table-wrap"><table><thead><tr><th>Charge number</th><th>Status</th><th>Created</th><th>Delivered</th><th>Description</th><th></th></tr></thead><tbody>${charges.map((charge,index)=>`<tr><td>${esc(charge.charge_number||charge.charge_code||'—')}</td><td>${esc(charge.status||'—')}</td><td>${esc(charge.created_on||'—')}</td><td>${esc(charge.delivered_on||'—')}</td><td>${esc(charge.particulars?.description||charge.description||'—')}</td><td><button class="btn btn-ghost btn-sm" data-charge-index="${index}">Details</button></td></tr>`).join('')}</tbody></table></div><div id="chargeDetails"></div>`:'<div class="empty">No charges returned.</div>';$('view').innerHTML=`<div class="btnrow" style="margin-top:0"><button class="btn btn-ghost" onclick="go('search')">← Back to search</button></div><div class="card pad-lg"><div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start"><div><h1 class="page-h" style="margin-bottom:6px">${esc(company.company_name||'Company')} ${priorityPill()}</h1><div style="color:var(--muted);font-size:12.5px">${esc(company.company_number||number)} · ${statusPill(company.company_status)} · ${esc(company.type||'—')}</div></div><div class="btnrow" style="margin:0"><button class="btn ${inList?'btn-ghost':'btn-pink'} btn-sm" id="leadBtn">${inList?'✓ In session lead list':'+ Add to lead list'}</button></div></div><div id="leadStatus" class="status"></div></div><div class="cols"><div><div class="card"><div class="stitle">Charges timeline</div><ul class="tl">${timeline||'<li class="empty">No charges returned.</li>'}</ul></div></div><div><div class="card"><div class="stitle">Overview</div><div class="meta-grid"><div class="m"><span class="k">Company number</span><span class="v">${esc(company.company_number||number)}</span></div><div class="m"><span class="k">Status</span><span class="v">${esc(company.company_status||'—')}</span></div><div class="m"><span class="k">Type</span><span class="v">${esc(company.type||'—')}</span></div><div class="m"><span class="k">Incorporated</span><span class="v">${fmtDate(company.date_of_creation)}</span></div><div class="m"><span class="k">Registered office</span><span class="v" style="font-weight:500">${esc(Object.values(company.registered_office_address||{}).join(', ')||'—')}</span></div><div class="m"><span class="k">SIC codes</span><span class="v">${esc((company.sic_codes||[]).join(', ')||'—')}</span></div></div></div><div class="card"><div class="stitle">Officers</div>${officerRows}</div></div></div><div class="card"><div class="stitle">Charges</div>${chargeRows}</div><div class="card"><div class="stitle">Known properties</div><div class="callout" style="margin-top:0">Land Registry data is not yet connected. This section will show registered titles and sale history once a Land Registry Function is added.</div></div>`;$('leadBtn').onclick=()=>saveLead(company.company_number||number)}
function renderChargeDetail(charge){const container=$('chargeDetails');if(!container||!charge)return;const particulars=charge.particulars||{};const entitled=Array.isArray(charge.persons_entitled)?charge.persons_entitled:[];const entitledHtml=entitled.length?`<ul class="rules">${entitled.map(person=>`<li>${esc(typeof person==='string'?person:person.name||person.description||JSON.stringify(person))}</li>`).join('')}</ul>`:'<div class="empty">No persons entitled were provided in the charge-list response.</div>';const fields=[['Charge number',charge.charge_number||charge.charge_code],['Status',charge.status],['Created',charge.created_on],['Delivered',charge.delivered_on],['Satisfied',charge.satisfied_on],['Classification type',charge.classification?.type],['Classification description',charge.classification?.description],['Particulars description',particulars.description],['Contains fixed charge',particulars.contains_fixed_charge],['Contains floating charge',particulars.contains_floating_charge],['Contains negative pledge',particulars.contains_negative_pledge],['Ranking',charge.ranking]].filter(([,value])=>value!==undefined&&value!==null&&value!=='');container.innerHTML=`<div class="card"><div class="stitle">Charge detail</div><div class="meta-grid">${fields.map(([label,value])=>`<div class="m"><span class="k">${esc(label)}</span><span class="v" style="font-weight:500">${esc(String(value))}</span></div>`).join('')}</div><div style="margin-top:16px"><div class="stitle">Persons entitled</div>${entitledHtml}</div></div>`;container.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function saveLead(companyNumber){const status=$('leadStatus');const button=$('leadBtn');status.textContent='Importing company and charges into Neon…';button.disabled=true;try{await getJSON(`${API.companyImport}?number=${encodeURIComponent(companyNumber)}`);status.textContent='Saving company to the Neon-backed lead list…';const data=await getJSON(API.leadList,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company_number:companyNumber})});if(!STATE.staticList.includes(companyNumber))STATE.staticList.push(companyNumber);status.textContent=`Saved to lead list ${data.lead_list_id}.`;button.textContent='✓ Saved to lead list'}catch(error){status.innerHTML=`<div class="error">${esc(error.message)}</div>`;button.disabled=false}}
function renderLenders(){$('view').innerHTML=`<h1 class="page-h">Lenders</h1><p class="page-sub">This view will show lender-level analytics once the backend dataset is populated.</p><div class="card"><div class="empty">Lender analytics will be enabled after imported charge data is queryable in Neon.</div></div>`}
function renderLeads(){const rows=STATE.staticList.map(number=>`<tr><td class="co"><button class="company-btn" data-lead-company="${esc(number)}">${esc(number)}</button></td><td><button class="btn btn-ghost btn-sm" data-remove-company="${esc(number)}">Remove</button></td></tr>`).join('');$('view').innerHTML=`<h1 class="page-h">Lead lists</h1><p class="page-sub">Companies added in this browser session. The actual membership is also saved through the Neon-backed lead-list Function.</p><div class="card"><div class="stitle">Static list <span class="count">${STATE.staticList.length} companies</span></div>${STATE.staticList.length?`<div class="table-wrap"><table><thead><tr><th>Company number</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">No companies saved yet. Open Search, select a result and use Add to lead list.</div>'}</div>`}
function renderMonitoring(){$('view').innerHTML=`<h1 class="page-h">Monitoring</h1><p class="page-sub">This view will show alerts on new charges, competitor activity and status changes once backend ingest and change detection are in place.</p><div class="card"><div class="empty">Monitoring is not yet connected.</div></div>`}
$('view').addEventListener('click',event=>{const detail=event.target.closest('[data-charge-index]');if(detail&&STATE.companyData?.charges){renderChargeDetail(STATE.companyData.charges[Number(detail.dataset.chargeIndex)]);return}const company=event.target.closest('[data-lead-company]');if(company){go(`company/${encodeURIComponent(company.dataset.leadCompany)}`);return}const remove=event.target.closest('[data-remove-company]');if(remove){STATE.staticList=STATE.staticList.filter(number=>number!==remove.dataset.removeCompany);renderLeads()}});
router();
</script>
</body>
