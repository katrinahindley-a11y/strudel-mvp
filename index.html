<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cohort Capital — Charge Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--navy:#212A58;--blue:#38499B;--pink:#FF63AE;--muted:#555570;--pale:#E8EBF6;--line:#e2e5f0;--bg:#f4f5f9;--body:#333348;--font:'DM Sans',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--body);font:13px/1.6 var(--font)}button,input{font:inherit}.site-header{background:var(--navy);color:#fff;border-bottom:3px solid var(--pink);padding:16px 28px}.header-inner,.nav-inner,.wrap,.footer-inner{max-width:1180px;margin:auto}.brand{font-weight:700;font-size:16px}.brand small{display:block;color:#9ca8dc;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.nav{background:#2c297d}.nav-inner{display:flex;gap:4px;padding:0 28px;overflow:auto}.nav a{color:#fff;text-decoration:none;padding:11px 15px;border-bottom:3px solid transparent;white-space:nowrap}.nav a.active{border-bottom-color:var(--pink)}.wrap{padding:24px 28px 60px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px 24px;margin-bottom:18px;box-shadow:0 1px 4px #212a5810}.page-h{color:var(--navy);font-size:24px;margin-bottom:5px}.page-sub{color:var(--muted);margin-bottom:20px}.stitle{color:var(--blue);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--pale);padding-bottom:8px;margin-bottom:16px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px}.field{display:flex;flex-direction:column;gap:5px}.field.span2{grid-column:span 2}label{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--muted)}input,select{border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--body);background:#fff;width:100%}select[multiple]{min-height:85px}.btnrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.btn{border:1px solid transparent;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer}.btn-primary{background:var(--blue);color:#fff}.btn-pink{background:var(--pink);color:#fff}.btn-ghost{background:#fff;color:var(--blue);border-color:var(--line)}.btn:disabled{opacity:.5;cursor:not-allowed}.status{font-size:12px;color:var(--muted);margin-top:10px}.error{color:#a3423a;background:#fff0ef;border:1px solid #e4c2be;padding:10px;border-radius:6px;margin-top:12px}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th{background:var(--pale);text-align:left;font-size:10px;text-transform:uppercase;padding:9px;white-space:nowrap}td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}.company-btn,.charge-btn{border:0;background:none;color:var(--blue);font-weight:700;text-align:left;padding:0;cursor:pointer}.company-btn:hover,.charge-btn:hover{text-decoration:underline}.pagination{display:flex;align-items:center;gap:12px;margin-top:14px}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 24px}.detail-grid div{padding:7px 0;border-bottom:1px solid var(--line)}.detail-grid small{display:block;color:var(--muted);text-transform:uppercase;font-size:10px;font-weight:700}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:var(--pale);color:var(--blue);font-size:11px;font-weight:700}.site-footer{background:var(--navy);color:#fff;padding:18px 28px;border-top:3px solid var(--pink)}@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.field.span2{grid-column:span 2}}@media(max-width:600px){.filters,.detail-grid{grid-template-columns:1fr}.field.span2{grid-column:span 1}.wrap{padding:16px}.nav-inner{padding:0 16px}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner"><div class="brand">Cohort Capital<small>Charge Intelligence</small></div></div></header>
<nav class="nav"><div class="nav-inner"><a href="#/overview" data-route="overview">Overview</a><a href="#/search" data-route="search">Search</a><a href="#/results" data-route="results">Results</a><a href="#/leads" data-route="leads">Lead lists</a></div></nav>
<main class="wrap" id="view"></main>
<footer class="site-footer"><div class="footer-inner">Cohort Capital — Charge Intelligence</div></footer>
<script>
const API={search:'/.netlify/functions/search',company:'/.netlify/functions/company',charge:'/.netlify/functions/charge',leadList:'/.netlify/functions/lead_list'};
const state={query:'',page:1,search:{items:[],total_results:0,items_per_page:20},selectedNumber:null,company:null,charge:null,staticList:[],error:''};
const $=id=>document.getElementById(id); const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=value=>value?new Date(value).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'—';
async function getJSON(url,options){const r=await fetch(url,options);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}
function setNav(route){document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===route))}
function go(path){location.hash='#/'+path}
function render(){const raw=(location.hash||'#/overview').slice(2);const [route,arg]=raw.split('/');setNav(route);if(route==='search')renderSearch();else if(route==='results')renderResults();else if(route==='company')renderCompany(decodeURIComponent(arg||''));else if(route==='leads')renderLeads();else renderOverview()}
window.addEventListener('hashchange',render);
function renderOverview(){
 $('view').innerHTML=`<div class="card"><h1 class="page-h">Charge Intelligence</h1><p class="page-sub">Search Companies House records, review company charges and save imported companies to the Neon-backed lead list.</p><button class="btn btn-primary" onclick="go('search')">Start a company search</button></div>`;
}
function renderSearch(){
 $('view').innerHTML=`<h1 class="page-h">Search Companies House</h1><p class="page-sub">Search by company name or number. Results are retrieved through the existing Netlify Function; no API key is exposed in this page.</p><div class="card"><div class="field"><label for="query">Company name or number</label><input id="query" type="text" value="${esc(state.query)}" placeholder="e.g. property development"></div><div class="btnrow"><button class="btn btn-primary" id="searchBtn">Search</button></div><div id="searchStatus" class="status"></div></div><div id="resultsCard"></div>`;
 $('searchBtn').onclick=()=>runSearch(1);$('query').onkeydown=e=>{if(e.key==='Enter')runSearch(1)};renderSearchResults();
}
async function runSearch(page=1){const q=$('query')?.value.trim()||state.query;if(!q)return;state.query=q;state.page=page;$('searchStatus').textContent='Searching Companies House…';try{state.search=await getJSON(`${API.search}?q=${encodeURIComponent(q)}&page=${page}`);$('searchStatus').textContent=`${state.search.total_results||0} results found.`;renderSearchResults()}catch(e){$('searchStatus').innerHTML=`<span class="error">${esc(e.message)}</span>`}}
function renderSearchResults(){const box=$('resultsCard');if(!box)return;const items=state.search.items||[];if(!items.length){box.innerHTML=state.query?'<div class="card"><div class="empty">No results found.</div></div>':'';return}box.innerHTML=`<div class="card"><div class="stitle">Search results</div><div class="table-wrap"><table><thead><tr><th>Company</th><th>Number</th><th>Status</th><th>Address</th></tr></thead><tbody>${items.map(x=>`<tr><td><button class="company-btn" data-number="${esc(x.company_number)}">${esc(x.title||x.company_name)}</button></td><td>${esc(x.company_number)}</td><td>${esc(x.company_status)}</td><td>${esc([x.address?.address_line_1,x.address?.locality,x.address?.postal_code].filter(Boolean).join(', '))}</td></tr>`).join('')}</tbody></table></div><div class="pagination"><button class="btn btn-ghost" id="prev" ${state.page<=1?'disabled':''}>Previous</button><span>Page ${state.page} of ${Math.max(1,Math.ceil((state.search.total_results||0)/(state.search.items_per_page||20)))}</span><button class="btn btn-ghost" id="next" ${state.page>=Math.ceil((state.search.total_results||0)/(state.search.items_per_page||20))?'disabled':''}>Next</button></div></div>`;box.querySelectorAll('.company-btn').forEach(b=>b.onclick=()=>go(`company/${encodeURIComponent(b.dataset.number)}`));$('prev').onclick=()=>runSearch(state.page-1);$('next').onclick=()=>runSearch(state.page+1)}
function renderResults(){go(state.selectedNumber?`company/${encodeURIComponent(state.selectedNumber)}`:'search')}
async function loadCompany(number){state.selectedNumber=number;state.company=null;state.charge=null;renderCompany(number);try{state.company=await getJSON(`${API.company}?number=${encodeURIComponent(number)}`);renderCompany(number)}catch(e){$('companyOutput').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function renderCompany(number){const d=state.company;if(!d){$('view').innerHTML=`<div class="card"><div class="status">Loading company profile…</div><div id="companyOutput"></div></div>`;loadCompany(number);return}const c=d.company||{};const charges=d.charges||[];$('view').innerHTML=`<div class="btnrow" style="margin-top:0"><button class="btn btn-ghost" onclick="go('search')">← Back to search</button></div><div class="card"><h1 class="page-h">${esc(c.company_name)}</h1><p class="page-sub">${esc(c.company_number)} · ${esc(c.company_status)} · ${esc(c.type)}</p><div class="detail-grid"><div><small>Registered office</small>${esc(Object.values(c.registered_office_address||{}).join(', '))}</div><div><small>Incorporated</small>${fmtDate(c.date_of_creation)}</div><div><small>SIC codes</small>${esc((c.sic_codes||[]).join(', ')||'—')}</div><div><small>Stored record</small>${esc(d.stored_id)}</div></div><div class="btnrow"><button class="btn btn-pink" id="leadBtn">${state.staticList.includes(c.company_number)?'✓ Saved to session list':'Add to Neon lead list'}</button></div><div id="leadStatus" class="status"></div></div><div class="card"><div class="stitle">Officers</div>${renderOfficers(d.officers||[])}</div><div class="card"><div class="stitle">Charges</div>${renderCharges(charges,c.company_number)}</div>`;$('leadBtn').onclick=()=>saveLead(c.company_number)}
function renderOfficers(items){if(!items.length)return '<div class="empty">No officers returned.</div>';return `<div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Appointed</th><th>Resigned</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.officer_role)}</td><td>${esc(x.appointed_on)}</td><td>${esc(x.resigned_on||'—')}</td></tr>`).join('')}</tbody></table></div>`}
function renderCharges(items,number){if(!items.length)return '<div class="empty">No charges returned.</div>';return `<div class="table-wrap"><table><thead><tr><th>Charge number</th><th>Status</th><th>Created</th><th>Delivered</th><th>Description</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.charge_number||'—')}</td><td>${esc(x.status||'—')}</td><td>${esc(x.created_on||'—')}</td><td>${esc(x.delivered_on||'—')}</td><td>${esc(x.particulars?.description||x.description||'—')}</td><td><button class="btn btn-ghost" data-charge="${esc(x.charge_number||x.charge_code||'')}">Details</button></td></tr>`).join('')}</tbody></table></div><div id="chargeDetails"></div>`}
async function loadCharge(number,charge){$('chargeDetails').innerHTML='<div class="status">Loading charge details…</div>';try{state.charge=await getJSON(`${API.charge}?company=${encodeURIComponent(number)}&charge=${encodeURIComponent(charge)}`);$('chargeDetails').innerHTML=`<div class="card"><div class="stitle">Charge detail</div><pre style="white-space:pre-wrap;overflow:auto">${esc(JSON.stringify(state.charge,null,2))}</pre></div>`}catch(e){$('chargeDetails').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function saveLead(number){$('leadStatus').textContent='Saving company to Neon-backed lead list…';try{const d=await getJSON(API.leadList,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company_number:number})});state.staticList.push(number);$('leadStatus').textContent=`Saved to lead list ${d.lead_list_id}.`;$('leadBtn').textContent='✓ Saved to Neon lead list'}catch(e){$('leadStatus').innerHTML=`<span class="error">${esc(e.message)}</span>`}}
function renderLeads(){$('view').innerHTML=`<h1 class="page-h">Lead lists</h1><p class="page-sub">Companies are saved through the existing Neon-backed lead-list Function.</p><div class="card"><div class="stitle">Session list</div>${state.staticList.length?`<ul>${state.staticList.map(n=>`<li><button class="company-btn" onclick="go('company/${encodeURIComponent(n)}')">${esc(n)}</button></li>`).join('')}</ul>`:'<div class="empty">No companies saved in this browser session.</div>'}</div>`}
$('view').addEventListener('click',e=>{const b=e.target.closest('[data-charge]');if(b)loadCharge(state.selectedNumber,b.dataset.charge)});
render();
</script>
</body>
</html>
