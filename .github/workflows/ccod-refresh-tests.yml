name: CCOD monthly refresh policy tests

on:
  push:
    branches: [land-registry-full-import]
    paths:
      - scripts/ccod_refresh_policy.py
      - scripts/test_ccod_refresh_policy.py
      - .github/workflows/ccod-refresh-tests.yml

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline policy tests without secrets or database access
        run: python -m unittest discover -s scripts -p test_ccod_refresh_policy.py -v
