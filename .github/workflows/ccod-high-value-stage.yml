name: CCOD five-million staging rehearsal

on:
  push:
    branches: [land-registry-full-import]
    paths: [.github/workflows/ccod-high-value-stage.yml]

permissions:
  contents: read

concurrency:
  group: ccod-high-value-staging
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check staging script syntax
        run: python -m py_compile scripts/ccod_high_value_stage.py
      - name: Test footer handling without credentials
        run: python scripts/ccod_footer_diagnostics.py --self-test
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4' requests
      - name: Stage qualifying titles, check conflicts and roll back
        env:
          CCOD_TEST_DATABASE_URL: ${{ secrets.CCOD_TEST_DATABASE_URL }}
          LAND_REGISTRY_API_KEY: ${{ secrets.LAND_REGISTRY_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/ccod_high_value_stage.py
