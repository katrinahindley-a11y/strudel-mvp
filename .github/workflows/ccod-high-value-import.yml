name: CCOD five-million guarded test import

on:
  push:
    branches: [land-registry-full-import]
    paths: [.github/workflows/ccod-high-value-import.yml]

permissions:
  contents: read

concurrency:
  group: ccod-high-value-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check import script syntax
        run: python -m py_compile scripts/ccod_high_value_import.py
      - name: Test strict footer handling without credentials
        run: python scripts/ccod_footer_diagnostics.py --self-test
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4' requests
      - name: Import approved November subset into guarded test branch
        env:
          CCOD_IMPORT_APPROVAL: IMPORT_NOVEMBER_2026_OVER_5000000_TEST_ONLY
          CCOD_TEST_DATABASE_URL: ${{ secrets.CCOD_TEST_DATABASE_URL }}
          LAND_REGISTRY_API_KEY: ${{ secrets.LAND_REGISTRY_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/ccod_high_value_import.py
