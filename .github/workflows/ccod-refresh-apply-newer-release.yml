name: CCOD check and apply newer release (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccod-refresh-apply-newer-release
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check newer-release runner syntax
        run: python -m py_compile scripts/ccod_refresh_apply_newer_release.py
      - name: Test footer handling without credentials
        run: python scripts/ccod_footer_diagnostics.py --self-test
      - name: Install pinned dependencies
        run: python -m pip install 'psycopg[binary]==3.2.3' 'requests==2.32.3'
      - name: Check for and apply a newer CCOD release
        env:
          CCOD_APPLY_NEWER_RELEASE_APPROVAL: NEWER_RELEASE_ONLY
          CCOD_TEST_DATABASE_URL: ${{ secrets.CCOD_TEST_DATABASE_URL }}
          LAND_REGISTRY_API_KEY: ${{ secrets.LAND_REGISTRY_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/ccod_refresh_apply_newer_release.py
