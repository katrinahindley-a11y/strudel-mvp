name: CCOD £5m selection validation

on:
  workflow_dispatch:
    inputs:
      resource:
        description: 'CCOD monthly ZIP filename'
        required: true
        default: 'CCOD_FULL_2026_11.zip'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4' requests

      - name: Validate £5m selection
        env:
          CCOD_MODE: validate
          CCOD_RESOURCE: ${{ github.event.inputs.resource }}
          CCOD_TEST_DATABASE_URL: ${{ secrets.CCOD_TEST_DATABASE_URL }}
          CCOD_TEST_EXPECTED_HOST: ${{ secrets.CCOD_TEST_EXPECTED_HOST }}
          LAND_REGISTRY_API_KEY: ${{ secrets.LAND_REGISTRY_API_KEY }}
        run: python scripts/ccod_high_value_validate.py
