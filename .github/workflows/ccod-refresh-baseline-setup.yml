name: CCOD refresh baseline setup (test database)

on:
  push:
    branches: [land-registry-full-import]
    paths: [.github/workflows/ccod-refresh-baseline-setup.yml]

permissions:
  contents: read

concurrency:
  group: ccod-refresh-baseline-setup
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check baseline setup syntax
        run: python -m py_compile scripts/ccod_refresh_baseline_setup.py
      - name: Test footer handling without credentials
        run: python scripts/ccod_footer_diagnostics.py --self-test
      - name: Install pinned dependencies
        run: python -m pip install 'psycopg[binary]==3.2.3' 'requests==2.32.3'
      - name: Install verified November baseline
        env:
          CCOD_BASELINE_SETUP_APPROVAL: NOVEMBER_BASELINE_PERMANENT
          CCOD_TEST_DATABASE_URL: ${{ secrets.CCOD_TEST_DATABASE_URL }}
          LAND_REGISTRY_API_KEY: ${{ secrets.LAND_REGISTRY_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/ccod_refresh_baseline_setup.py
