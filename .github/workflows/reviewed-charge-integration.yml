name: Reviewed staging integration (disposable database)

on:
  push:
    branches: ['feat/company-identity-review']
    paths: ['scripts/**', 'tests/**', 'migrations/**', '.github/workflows/reviewed-charge-integration.yml']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'migrations/**', '.github/workflows/reviewed-charge-integration.yml']

permissions:
  contents: read

jobs:
  reviewed-charge-node22-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: charge_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: neondb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U charge_ci -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run reviewed staging and CLI tests with SQL-response fixtures
        run: node --test tests/reviewed_charge_staging.test.mjs
      - name: Install Postgres driver without lifecycle scripts
        run: npm install --no-save --ignore-scripts --package-lock=false --no-audit --no-fund pg@8.13.1
      - name: Test migrations, authentication and staging on disposable Postgres
        env:
          RUN_REVIEWED_POSTGRES: '1'
          CHARGE_CI_DATABASE_URL: postgresql://charge_ci:disposable_ci_only@localhost:5432/neondb
        run: node --test tests/reviewed_charge_postgres.test.mjs
