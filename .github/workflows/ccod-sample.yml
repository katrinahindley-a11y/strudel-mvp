name: CCOD 1000-title test sample

on:
  push:
    branches: [land-registry-full-import]
    paths:
      - .github/workflows/ccod-sample.yml

permissions:
  contents: read

concurrency:
  group: ccod-test-import
  cancel-in-progress: false

jobs:
  sample:
    if: github.repository == 'katrinahindley-a11y/strudel-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the exact tested import core
        uses: actions/checkout@v4
        with:
          ref: ba522f4d025e07c4a3dd1c455401c0bec721f549
          path: tested
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install 'psycopg[binary]==3.2.3' 'requests==2.32.3'
      - name: Check sample runner syntax
        run: python -m py_compile scripts/ccod_sample.py
      - name: Import sample and verify repeat run atomically
        env:
          CCOD_SAMPLE_CONFIRM: england-wales-property-test
          CCOD_TEST_DATABASE_URL: ${{ secrets.CCOD_TEST_DATABASE_URL }}
          LAND_REGISTRY_API_KEY: ${{ secrets.LAND_REGISTRY_API_KEY }}
        run: python -u scripts/ccod_sample.py
