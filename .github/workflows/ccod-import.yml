name: CCOD guarded test import

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only, import first 1000 titles, or import full file
        type: choice
        options: [validate, sample, full]
        default: validate
        required: true
      resource:
        description: Exact CCOD full ZIP filename
        default: CCOD_FULL_2026_11.zip
        required: true
      expected_titles:
        description: Exact source CSV title count (required for full mode; 0 otherwise)
        default: '0'
        required: true
      confirm_target:
        description: Type england-wales-property-test for sample or full import
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: ccod-test-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install import dependencies
        run: python -m pip install 'psycopg[binary]==3.2.3' 'requests==2.32.3'
      - name: Validate or import into guarded test database
        env:
          CCOD_TEST_DATABASE_URL: ${{ secrets.CCOD_TEST_DATABASE_URL }}
          LAND_REGISTRY_API_KEY: ${{ secrets.LAND_REGISTRY_API_KEY }}
          CCOD_MODE: ${{ inputs.mode }}
          CCOD_RESOURCE: ${{ inputs.resource }}
          CCOD_EXPECTED_TITLES: ${{ inputs.expected_titles }}
          CCOD_CONFIRM_TARGET: ${{ inputs.confirm_target }}
        run: python -u scripts/ccod_import.py
