name: CCOD importer tests (no Neon)

on:
  push:
    branches: [land-registry-full-import]
    paths:
      - scripts/ccod_import.py
      - tests/test_ccod_import.py
      - migrations/001_property_ownership.sql
      - .github/workflows/ccod-import.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ccod-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccod_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: ccod_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccod_ci -d ccod_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install 'psycopg[binary]==3.2.3' 'requests==2.32.3'
      - name: Check Python syntax
        run: python -m py_compile scripts/ccod_import.py tests/test_ccod_import.py
      - name: Test fixtures and real inserts in disposable PostgreSQL
        env:
          CCOD_CI_DATABASE_URL: postgresql://ccod_ci:disposable_ci_only@localhost:5432/ccod_ci
        run: python -m unittest discover -s tests -p test_ccod_import.py -v
