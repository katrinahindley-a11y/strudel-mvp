name: CCOD live validation only

on:
  push:
    branches: [land-registry-full-import]
    paths:
      - .github/workflows/ccod-live-validation.yml

permissions:
  contents: read

concurrency:
  group: ccod-test-import
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'katrinahindley-a11y/strudel-mvp'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the tested importer commit
        uses: actions/checkout@v4
        with:
          ref: ba522f4d025e07c4a3dd1c455401c0bec721f549
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install 'psycopg[binary]==3.2.3' 'requests==2.32.3'
      - name: Validate first 1000 titles without persistent property writes
        env:
          CCOD_MODE: validate
          CCOD_RESOURCE: CCOD_FULL_2026_11.zip
          CCOD_TEST_EXPECTED_HOST: ep-divine-mud-za5xlaae.c-2.eu-west-2.aws.neon.tech
          CCOD_TEST_DATABASE_URL: ${{ secrets.CCOD_TEST_DATABASE_URL }}
          LAND_REGISTRY_API_KEY: ${{ secrets.LAND_REGISTRY_API_KEY }}
        run: python -u scripts/ccod_import.py
