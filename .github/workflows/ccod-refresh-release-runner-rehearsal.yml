name: CCOD release runner rehearsal (rollback only)

on:
  push:
    branches: [land-registry-full-import]
    paths: [.github/workflows/ccod-refresh-release-runner-rehearsal.yml]

permissions:
  contents: read

concurrency:
  group: ccod-refresh-release-runner-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release-runner rehearsal syntax
        run: python -m py_compile scripts/ccod_refresh_release_runner_rehearsal.py
      - name: Test footer handling without credentials
        run: python scripts/ccod_footer_diagnostics.py --self-test
      - name: Install pinned dependencies
        run: python -m pip install 'psycopg[binary]==3.2.3' 'requests==2.32.3'
      - name: Rehearse latest CCOD release with mandatory rollback
        env:
          CCOD_RELEASE_RUNNER_REHEARSAL: ROLLBACK_ONLY
          CCOD_TEST_DATABASE_URL: ${{ secrets.CCOD_TEST_DATABASE_URL }}
          LAND_REGISTRY_API_KEY: ${{ secrets.LAND_REGISTRY_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/ccod_refresh_release_runner_rehearsal.py
