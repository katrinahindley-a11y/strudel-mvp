name: Nautilina charge staging pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nautilina-charge-staging-pilot
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without lifecycle scripts
        run: npm install --no-save --ignore-scripts --package-lock=false --no-audit --no-fund pg@8.13.1
      - name: Stage Nautilina charge snapshot
        env:
          CCOD_TEST_DATABASE_URL: ${{ secrets.CCOD_TEST_DATABASE_URL }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: node scripts/run_company_charge_import.mjs --company 15372161 --max-pages 10 --max-requests 12 --apply
