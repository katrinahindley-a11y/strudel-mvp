<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strudel | Company Intelligence</title>
  <style>
    :root { --ink:#17202a; --muted:#667085; --line:#e6e8ec; --brand:#6d4aff; --bg:#f7f8fb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#fff; border-bottom:1px solid var(--line); padding:18px 28px; display:flex; justify-content:space-between; align-items:center; }
    .brand { font-size:22px; font-weight:800; letter-spacing:-.03em; }
    .brand span { color:var(--brand); }
    main { max-width:1200px; margin:0 auto; padding:32px 24px 60px; }
    .hero { margin-bottom:24px; }
    h1 { margin:0 0 8px; font-size:32px; letter-spacing:-.04em; }
    .muted { color:var(--muted); }
    .searchbar { display:flex; gap:10px; margin:24px 0; }
    input, select, button { font:inherit; }
    input, select { border:1px solid #d9dde5; border-radius:8px; background:#fff; padding:12px 14px; }
    input { flex:1; min-width:220px; }
    button { border:0; border-radius:8px; padding:12px 16px; cursor:pointer; font-weight:700; }
    .primary { background:var(--brand); color:#fff; }
    .secondary { background:#fff; border:1px solid #d9dde5; color:var(--ink); }
    .grid { display:grid; grid-template-columns:300px 1fr; gap:20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(16,24,40,.03); }
    .filters label { display:block; font-size:12px; font-weight:700; margin:14px 0 6px; color:#475467; }
    .filters select, .filters input { width:100%; }
    .results-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
    .company { border:1px solid var(--line); border-radius:10px; padding:16px; margin:10px 0; cursor:pointer; }
    .company:hover { border-color:var(--brand); }
    .company-top { display:flex; justify-content:space-between; gap:12px; }
    .company-name { font-weight:800; }
    .badge { display:inline-block; border-radius:999px; padding:4px 9px; font-size:11px; font-weight:800; background:#ecfdf3; color:#027a48; }
    .meta { display:flex; flex-wrap:wrap; gap:14px; margin-top:12px; color:var(--muted); font-size:13px; }
    .profile { display:none; }
    .profile.active { display:block; }
    .back { margin-bottom:16px; }
    .profile-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:18px 0; }
    .stat { border:1px solid var(--line); border-radius:9px; padding:14px; }
    .stat strong { display:block; font-size:22px; margin-top:4px; }
    table { border-collapse:collapse; width:100%; font-size:14px; }
    th, td { border-bottom:1px solid var(--line); padding:11px 8px; text-align:left; }
    th { color:var(--muted); font-size:12px; }
    .error { color:#b42318; background:#fef3f2; padding:12px; border-radius:8px; margin:12px 0; }
    @media(max-width:800px) { .grid { grid-template-columns:1fr; } .profile-grid { grid-template-columns:1fr 1fr; } .searchbar { flex-wrap:wrap; } }
  </style>
</head>
<body>
  <header><div class="brand"><span>Strudel</span> Intelligence</div><div class="muted">Property-finance origination</div></header>
  <main>
    <section id="searchView">
      <div class="hero"><h1>Find property-finance opportunities</h1><div class="muted">Search UK companies, officers and secured borrowing activity.</div></div>
      <div class="searchbar"><input id="query" placeholder="Company name or company number" autocomplete="off"><button class="primary" onclick="searchCompanies()">Search</button></div>
      <div class="grid">
        <aside class="card filters"><strong>Filters</strong><label>Status</label><select id="status"><option value="">Any status</option><option value="active">Active</option><option value="dissolved">Dissolved</option></select><label>SIC code</label><input id="sic" placeholder="e.g. 41100"><label>Location / postcode</label><input id="location" placeholder="e.g. London"><label>Charge status</label><select id="chargeStatus"><option value="">Any charge status</option><option value="outstanding">Outstanding</option><option value="satisfied">Satisfied</option></select></aside>
        <section class="card"><div class="results-head"><strong id="resultTitle">Search results</strong><button class="secondary" onclick="showLeadList()">Lead lists</button></div><div id="message" class="muted">Search for a company to begin.</div><div id="results"></div></section>
      </div>
    </section>
    <section id="profileView" class="profile"></section>
  </main>
<script>
  const api = '/api';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  async function request(path, options) { const r=await fetch(api+path, options); const d=await r.json(); if(!r.ok) throw new Error(d.error||'Request failed'); return d; }
  async function searchCompanies() {
    const q=document.getElementById('query').value.trim(); if(!q) return;
    document.getElementById('message').textContent='Searching Companies House…'; document.getElementById('results').innerHTML='';
    try { const d=await request('/search?q='+encodeURIComponent(q)); renderResults(d.items||[]); }
    catch(e) { document.getElementById('message').className='error'; document.getElementById('message').textContent=e.message; }
  }
  function renderResults(items) {
    document.getElementById('resultTitle').textContent=`${items.length} result${items.length===1?'':'s'}`; document.getElementById('message').textContent=items.length?'':'No companies found.';
    document.getElementById('results').innerHTML=items.map(c=>`<article class="company" onclick="openCompany('${esc(c.company_number)}')"><div class="company-top"><div><div class="company-name">${esc(c.title)}</div><div class="muted">${esc(c.company_number)}</div></div><span class="badge">${esc(c.company_status||'Unknown')}</span></div><div class="meta"><span>${esc(c.address_snippet||'')}</span><span>${esc((c.sic_codes||[]).join(', '))}</span></div></article>`).join('');
  }
  async function openCompany(number) {
    document.getElementById('searchView').style.display='none'; const view=document.getElementById('profileView'); view.className='profile active'; view.innerHTML='<div class="card">Loading company profile…</div>';
    try { const c=await request('/companies/'+encodeURIComponent(number)); view.innerHTML=profileHtml(c); } catch(e) { view.innerHTML=`<div class="card"><button class="secondary back" onclick="backToSearch()">← Back</button><div class="error">${esc(e.message)}</div></div>`; }
  }
  function profileHtml(c) { const company=c.company, officers=c.officers||[], charges=c.charges||[]; return `<div class="card"><button class="secondary back" onclick="backToSearch()">← Back to search</button><div class="company-top"><div><h1>${esc(company.company_name)}</h1><div class="muted">${esc(company.company_number)} · ${esc(company.company_status||'')}</div></div><button class="primary" onclick="saveLead('${esc(company.company_number)}')">Save to lead list</button></div><div class="profile-grid"><div class="stat">Status<strong>${esc(company.company_status||'—')}</strong></div><div class="stat">Incorporated<strong>${esc(company.date_of_creation||'—')}</strong></div><div class="stat">SIC codes<strong>${esc((company.sic_codes||[]).join(', ')||'—')}</strong></div></div><h2>Registered office</h2><p>${esc([company.registered_office_address?.address_line_1,company.registered_office_address?.locality,company.registered_office_address?.postal_code].filter(Boolean).join(', ')||'Not available')}</p><h2>Officers</h2><table><thead><tr><th>Name</th><th>Role</th><th>Appointed</th><th>Resigned</th></tr></thead><tbody>${officers.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(o.officer_role)}</td><td>${esc(o.appointed_on||'')}</td><td>${esc(o.resigned_on||'Current')}</td></tr>`).join('')||'<tr><td colspan="4">No officers available.</td></tr>'}</tbody></table><h2>Charges</h2><table><thead><tr><th>Created</th><th>Status</th><th>Satisfied</th><th>Description</th><th>Lender</th></tr></thead><tbody>${charges.map(x=>`<tr><td>${esc(x.created_on||'')}</td><td>${esc(x.status||'')}</td><td>${esc(x.satisfied_on||'')}</td><td>${esc(x.description||'')}</td><td>${esc((x.persons_entitled||[]).map(p=>p.name).join(', ')||'Not normalised')}</td></tr>`).join('')||'<tr><td colspan="5">No charges available.</td></tr>'}</tbody></table></div>`; }
  async function saveLead(number) { try { await request('/lead-lists/default/members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company_number:number})}); alert('Company saved to the default Strudel lead list.'); } catch(e) { alert(e.message); } }
  function backToSearch() { document.getElementById('profileView').className='profile'; document.getElementById('searchView').style.display='block'; }
  function showLeadList() { alert('Lead-list management will be added in the next Strudel build step.'); }
  document.getElementById('query').addEventListener('keydown', e=>{if(e.key==='Enter') searchCompanies();});
</script>
</body>
</html>
